[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-inference"
version = "0.1.0"
description = "Python bindings for the FORGE inference engine (ctypes over libforge.so)"
requires-python = ">=3.8"
optional-dependencies = { numpy = ["numpy"] }

[tool.setuptools]
packages = ["forge"]
[tool.setuptools.package-data]
forge = ["libforge.so"]
