name: ctest-linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RETDEC_GUI_HEADLESS: "1"
  QT_QPA_PLATFORM: offscreen

# A push on top of a push leaves the older run building for another
# forty minutes on a result nobody will read. standalone-check has had
# this since it was written; these two did not, and two macOS runs
# building LLVM side by side is how that was noticed.
concurrency:
  group: ctest-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # An LLVM debug build does not fit in the action's 500 MB default, and
      # the key keeps this job's objects out of the other workflows' caches.
      #
      # 2G was still not enough. The first run with the compiler launcher
      # actually wired up (see the Configure step) reported "Cache size (GB):
      # 2.0 / 2.0 (99.97%)" with 92 cleanups and 3 hits out of 3041 calls: the
      # cache filled during the build and evicted each object before anything
      # could reuse it, so the 55-minute build stayed 55 minutes. A debug LLVM
      # plus this tree is roughly 5 GB of objects; 8G leaves room for the next
      # run's misses without thrashing.
      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ctest-linux
          max-size: 8G

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3 \
            python3-yaml \
            perl \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            clang-tidy \
            llvm

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        with:
          cmakeVersion: "3.31.6"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Cache CMake build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Not ~/.cache/ccache: the ccache action above owns that directory,
          # and two actions restoring and saving the same path is how one of
          # them ends up writing an empty cache over the other's.
          path: build/linux
          key: ctest-linux-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/**/CMakeLists.txt') }}
          restore-keys: |
            ctest-linux-

      # The compiler launcher is what makes the ccache step above do anything.
      # Without it nothing invoked ccache at all: this job's own log reported
      # "Cache size (GB): 0.0 / 0.5" and "Not saving cache because no objects
      # are cached" beside a 55-minute build step, on every run. deps/*/
      # forward it into their ExternalProjects, which is where the LLVM build
      # -- almost all of that time -- happens.
      - name: Configure (full-linux-debug, CPU-only CI)
        run: >
          cmake --preset full-linux-debug
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_ENABLE_NEURAL=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build integration targets
        run: >
          cmake --build build/linux --parallel
          --target retdec-decompiler retdec-gui retdec-gui-tests
          format_router_probe retdec-decompiler-fixture-fib
          retdec-decompiler-runtime-share
          retdec-decompiler-corpus-fixtures
          retdec-gui-decompiler-staging

      - name: QUAL-08 ELF hardening (readelf)
        run: python3 scripts/ci/check_elf_hardening.py build/linux

      - name: QUAL-01 clang-tidy (Imortek modules)
        run: python3 scripts/ci/run_clang_tidy.py --compile-commands build/linux/compile_commands.json

      - name: GUI unit tests (headless)
        run: ./build/linux/tests/gui/retdec-gui-tests

      - name: Unit tests
        run: ctest --test-dir build/linux -L unit --output-on-failure

      - name: Integration tests
        run: ctest --test-dir build/linux --output-on-failure -L integration

      # The measured gates below print their headline numbers to stdout, and
      # stdout for this job is ~16 MB of clang-tidy output that the Actions log
      # API will not return past its own window -- so the numbers that decide
      # whether to raise a baseline were, in practice, unreadable. Each one now
      # also lands in the job summary, which is a few lines and always
      # retrievable.
      - name: Algorithm recovery live F1 (CI core subset)
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          # rc is captured rather than letting the pipeline abort the step: the
          # number is most worth reading when the gate FAILS, so the summary
          # has to be written either way.
          set -o pipefail
          rc=0
          bash scripts/run_algorithm_recovery_ci.sh --decompiler "$DEC" 2>&1 | tee /tmp/f1.log || rc=$?
          {
            echo "### Algorithm recovery (ci_core)"
            echo '```'
            grep -E 'mean_f1|REGRESSION|PASS|decompiled=' /tmp/f1.log || tail -n 5 /tmp/f1.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: CACHE-05 cache-on vs cache-off
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          FIB="$(find build/linux -name fib_smoke -type f | head -n1)"
          if [ -z "$FIB" ]; then echo "fib_smoke fixture not found"; exit 1; fi
          bash scripts/ci/check_cache_differential.sh --decompiler "$DEC" --binary "$FIB"

          CORPUS="tests/algorithm_recovery/corpus"
          mapfile -t NAMES < <(python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              'extract', 'scripts/extract_decompiler_predictions.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print('\n'.join(mod.CI_CORE_NAMES))
          ")
          EXTRA=()
          MISSING=()
          for name in "${NAMES[@]}"; do
            cand=""
            if [ -f "${CORPUS}/${name}" ]; then
              cand="${CORPUS}/${name}"
            elif [ -f "${CORPUS}/${name}.exe" ]; then
              cand="${CORPUS}/${name}.exe"
            else
              cand="$(find build/linux \( -name "${name}" -o -name "${name}.exe" \) -type f 2>/dev/null | head -n1)"
            fi
            if [ -n "${cand}" ] && [ -f "${cand}" ]; then
              EXTRA+=("${cand}")
            else
              MISSING+=("${name}")
            fi
          done
          if [ ${#EXTRA[@]} -eq 0 ]; then
            echo "CACHE-05: skipping ci-core extras — no CI_CORE_NAMES binaries under ${CORPUS} or build/linux (algorithm-recovery should have built the corpus)"
          else
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "CACHE-05: ${#MISSING[@]} ci-core name(s) not found, checking ${#EXTRA[@]} present: ${MISSING[*]}"
            fi
            ARGS=()
            for b in "${EXTRA[@]}"; do
              ARGS+=(--binary "$b")
            done
            bash scripts/ci/check_cache_differential.sh --decompiler "$DEC" --timeout 90 "${ARGS[@]}"
          fi

      # `llvm` above is what puts llvm-symbolizer on $PATH; without it LLVM's
      # crash handler falls back to dladdr and every frame of a crashing
      # decompile prints as a bare address.
      - name: DET-01 decompiler output determinism
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          # The algorithm-recovery step above builds the whole corpus (every
          # source at O0/O2/O3 with both gcc and clang), so this sweeps shapes
          # CACHE-05 never sees: it only checks nine gcc -O0 names, and the HLL
          # copy-propagation passes do not even go parallel below twenty-four
          # functions.  A third of the corpus, evenly spread so every compiler
          # and optimisation level is represented.
          set -o pipefail
          rc=0
          bash scripts/ci/check_output_determinism.sh \
            --decompiler "$DEC" \
            --corpus tests/algorithm_recovery/corpus \
            --limit 72 --timeout 120 2>&1 | tee /tmp/det01.log || rc=$?
          {
            echo "### DET-01 output determinism"
            echo '```'
            grep -E '^DET-01' /tmp/det01.log || tail -n 3 /tmp/det01.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # CLI-01. The four ways this tree used to report success for work it had
      # not done -- decompile() returning EXIT_SUCCESS from a bool, the batch
      # API handing that out for every job, an unopenable -o exiting 0 having
      # written nothing, and no unknown-option diagnostic at all. All four are
      # fixed in the source and none of them was read anywhere, which is how
      # they got in: an exit code nothing checks is one nothing keeps right.
      #
      # The success case is part of the check. A gate that only asserts
      # failures passes on a decompiler that fails at everything.
      - name: CLI-01 exit codes
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          bash scripts/ci/check_cli_exit_codes.sh --decompiler "$DEC"

      - name: CC-01 emitted C compiles
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          # Nothing in this repository had ever handed the emitted C to a
          # compiler -- DET-01 checks two runs agree, CACHE-05 that the cache
          # does not change it, the recovery gate that the detections are
          # right, and all three read it as text.  README reports 0/216
          # recompiling; the first run of this step, on d9e8108, measured
          # 21/24 (0.8750) on this slice, so the floor has been a measurement
          # rather than a guess from the start.  The three that failed were
          # two distinct defects: a goto to a label nothing defines, and calls
          # to libc functions with more arguments than those functions take.
          # The second was the emitted C contradicting itself: run 262's log
          # shows ring_buffer-gcc-O3 asking for `#include <stdio.h>` on line 7
          # -- HeadersForDeclaredFuncs adds it because retdec recognised
          # `putc` as a library function -- and then calling
          # `putc(c, stream, a3)` against the two-argument prototype that
          # header provides.  Semantics::getArityOfFunc() settled that one and
          # run 266 measured 23/24.
          #
          # The last one was generated_shell_sort-gcc-O2,
          # `label 'lab_0x112c' used but not defined`: splitWhileTrueLoop()
          # refuses to split a loop something jumps into, and asked that only
          # of the body's top-level statements, while the three
          # while_true_to_* passes that call it discard the loop-end `if` --
          # where the `break` a goto lands on actually sits.  Run 272 measured
          # 24/24, so the floor is 1.0000: every emitted C file on this slice
          # compiles, and any regression at all turns the run red.
          set -o pipefail
          rc=0
          bash scripts/ci/check_emitted_c_compiles.sh \
            --decompiler "$DEC" \
            --corpus tests/algorithm_recovery/corpus \
            --limit 24 --timeout 120 --min-rate 1.0000 \
            --save-failures cc01-failures 2>&1 | tee /tmp/cc01.log || rc=$?
          {
            echo "### CC-01 emitted C compiles"
            echo '```'
            # Also the indented continuation lines: the failing file names and
            # the compiler's own errors are printed under their headers with a
            # two-space indent, and a filter of '^CC-01' alone showed run 265
            # "files that did not compile:" with nothing under it -- the
            # headers without the diagnosis they introduce.
            grep -E '^CC-01|^  ' /tmp/cc01.log || tail -n 3 /tmp/cc01.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # ...and the other 192.
      #
      # The slice above is gated because its rate is known; this is the whole
      # corpus and its rate is not, so it reports and does not fail. The first
      # number becomes the floor in a follow-up commit naming the run, which
      # is how the slice itself was introduced.
      #
      # It is here rather than in the weekly nightly because the cost was
      # measured rather than assumed: run 272's CC-01 step took ten seconds
      # for 24 binaries, so the whole corpus is a couple of minutes against a job
      # that spends eight minutes building and seventeen in clang-tidy. A
      # measurement that cheap does not belong on a weekly cadence.
      # Run 276, at 2c3669d: 216 of 216, rate 1.0000. The whole corpus.
      #
      # Run 274 was the first whole-corpus measurement and reported 0.9630 --
      # eight files, three defects. Each was reduced from the .c and .ll that
      # --save-failures kept, reproduced locally, fixed, and measured:
      #
      #   274  208/216  0.9630  the three, all present
      #   275  214/216  0.9907  a `break` hoisted out of its loop, and a
      #                         `void *` as an operand of `|`
      #   276  216/216  1.0000  pthread_create called with one argument where
      #                         <pthread.h> declares four
      #
      # F1 held at 0.2302 and DET-01 at 72 binaries, 0 skipped, across all
      # three, so none of it was bought with detection quality or determinism.
      #
      # The floor is 1.0000 now: any regression at all turns the run red.
      #
      # 252 binaries, not 216: six floating-point sources joined the corpus.
      # Until they did, not one of its 367 sources contained a `float` or a
      # `double`, so "216/216 emitted C files compile" was 216 integer
      # programs and no gate here had ever put a floating-point instruction
      # through the decompiler -- on any architecture, x86-64 included. The
      # floor is a rate, so the count moving does not touch it; what is new is
      # that the rate now covers FP.
      - name: CC-01 emitted C compiles (all 252)
        if: always()
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          set -o pipefail
          rc=0
          bash scripts/ci/check_emitted_c_compiles.sh \
            --decompiler "$DEC" \
            --corpus tests/algorithm_recovery/corpus \
            --limit 0 --timeout 120 --errors 10 --min-rate 1.0000 \
            --save-failures cc01-failures-full 2>&1 | tee /tmp/cc01-full.log || rc=$?
          {
            echo "### CC-01 emitted C compiles (all 252)"
            echo '```'
            grep -E '^CC-01|^  ' /tmp/cc01-full.log || tail -n 3 /tmp/cc01-full.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # ARCH-01. src/capstone2llvmir translates five architectures and every
      # gate above measures one: every corpus binary is x86-64, so CC-01,
      # DET-01 and the F1 gate say nothing about ARM, ARM64, MIPS or PowerPC.
      # C2L-01 (standalone-check) covers their instruction semantics; this is
      # the first thing to ask what the decompiler does with a whole binary of
      # theirs.
      #
      # x86-64 is in the corpus too, as the control column: same sources, same
      # flags, same tools, so "is every architecture at x86-64's level" is a
      # question with an answer. It went in unfloored, which is the road every
      # other number in this file took; its first run, 292 at fb31221, read
      # 38/42, and the four failures were one assertion in bin2llvmir that the
      # SSE2 work had made reachable. With that fixed, 293 at 811319d read
      # 42/42 on every architecture and 210/210 overall, so all five are
      # floored at 1.0 now.
      #
      # Now a floor, because there is a measurement to floor. Run 288 at
      # 517db16 read 40/40, every architecture at 1.0000 -- the same rate CC-01
      # reports for x86-64 -- after three commits that took it from 0/40. The
      # road CC-01 took from 0/216 to 216/216, and the same discipline: measure
      # first, then gate at what was measured.
      #
      # Per architecture, not in aggregate. An overall floor of 1.0 would pass
      # while one architecture went to zero and another gained the same number
      # of binaries; that is precisely what a parity gate must not do.
      #
      # Bounded on purpose: --limit 40 over a corpus sorted by name gives ten
      # programs across all four architectures, and at --timeout 60 the worst
      # case is bounded rather than a job that hangs for hours.
      - name: ARCH-01 non-x86 decompilation
        if: always()
        run: |
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-mips-linux-gnu gcc-powerpc-linux-gnu \
            libc6-dev-arm64-cross libc6-dev-armhf-cross \
            libc6-dev-mips-cross libc6-dev-powerpc-cross
          bash scripts/build_multiarch_corpus.sh --out /tmp/ma-corpus
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          bash scripts/ci/check_multiarch_decompile.sh \
            --decompiler "$DEC" --corpus /tmp/ma-corpus \
            --limit 40 --timeout 60 \
            --arch-min "x86_64=1.0 arm=1.0 arm64=1.0 mips=1.0 powerpc=1.0" \
            --save-failures arch01-failures 2>&1 | tee /tmp/arch01.log
          {
            echo "### ARCH-01 non-x86 decompilation"
            echo '```'
            grep -E '^ARCH-01' /tmp/arch01.log || tail -n 3 /tmp/arch01.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"

      # ARCH-01 over the whole corpus, and a measurement rather than a floor.
      #
      # The floored step above takes --limit 40, which is the first ten
      # programs by name across the four architectures. The six floating-point
      # sources sort past that window, so the step that gates has never seen a
      # floating-point binary on any of these architectures -- and PowerPC and
      # 32-bit ARM only learned to translate floating point in the two commits
      # before this one.
      #
      # A floor now. Its first run, 290 at 938f6be, read 162/168 and the six
      # failures were two decompiler crashes -- fneg and freeze, both
      # unsupported by the IR-to-HLL converter, one of them reached by an
      # integer program. With those fixed, run 291 at 46075a9 read 168/168 on
      # every architecture, so that is what it is gated at.
      - name: ARCH-01 non-x86 decompilation (whole corpus)
        if: always()
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          bash scripts/ci/check_multiarch_decompile.sh \
            --decompiler "$DEC" --corpus /tmp/ma-corpus \
            --limit 0 --timeout 60 \
            --arch-min "x86_64=1.0 arm=1.0 arm64=1.0 mips=1.0 powerpc=1.0" \
            --save-failures arch01-full-failures 2>&1 | tee /tmp/arch01-full.log
          {
            echo "### ARCH-01 non-x86 decompilation (whole corpus)"
            echo '```'
            grep -E '^ARCH-01' /tmp/arch01-full.log || tail -n 3 /tmp/arch01-full.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"

      # IR2HLL-01. LLVMInstructionConverter::visitInstruction() calls FAIL(),
      # which aborts the process, and it is the fallback for any instruction
      # the IR-to-HLL expression converter has no case for. Three of those
      # were found in this branch -- fneg, freeze and atomicrmw -- each by a
      # corpus run after the fact, each because something started translating
      # an instruction that used to come out as a pseudo-asm call.
      #
      # This asks the question off LLVM's own Instruction.def instead, against
      # the LLVM the product is built with rather than whatever the runner has
      # installed. Run against the initial import it names all four of them
      # (fneg, freeze, atomicrmw, cmpxchg) with no corpus at all.
      - name: IR2HLL-01 every LLVM opcode is converted or cannot arrive
        if: always()
        run: |
          DEF="build/linux/external/src/llvm-project/llvm/include/llvm/IR/Instruction.def"
          if [ ! -f "$DEF" ]; then
            echo "IR2HLL-01: $DEF not found"; exit 1
          fi
          set -o pipefail
          rc=0
          python3 scripts/ci/check_ir2hll_opcodes.py --instruction-def "$DEF" \
            2>&1 | tee /tmp/ir2hll01.log || rc=$?
          {
            echo "### IR2HLL-01 opcode coverage"
            echo '```'
            cat /tmp/ir2hll01.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # COV-01. Of the instructions real binaries actually contain, what
      # fraction does each translator have a function for?
      #
      # This script existed and nothing ran it -- not this workflow, not
      # ci-smoke, not check_push_gates.sh. It also did not measure x86, on the
      # reasoning that x86 is the thing the others are compared against. That
      # is exactly the reasoning that let x86-64 ship without ADDSD: its own
      # coverage of floating-point programs was the lowest of the five, 0.9846,
      # and nobody had a number to notice it by.
      #
      # Floored at the measured values rather than below them. A toolchain
      # change that moves a rate down is a thing to be told about, and slack in
      # a floor is how a gate becomes more permissive than the thing it stands
      # in for. Measured over the 210-binary corpus the step above builds:
      #
      #   x86_64  0.9931  HLT, one per binary, alignment padding
      #   arm     1.0000
      #   arm64   1.0000
      #   mips    1.0000
      #   powerpc 1.0000
      #
      # ARM reads 1.0000 because COV-01 follows the $a/$t/$d mapping symbols
      # now instead of disassembling the whole .text in one mode. Its old
      # 0.9538 was measured over Thumb runs and literal pools decoded as ARM,
      # and its uncovered list was led by coprocessor instructions that are
      # not in these binaries at all. What it named once it could see was
      # HINT, IT, ADR, ORN, VPUSH and VPOP, and those are implemented.
      #
      # ARM64 reads 1.0000 because LD1 and ST1, the last two it had left, are
      # implemented -- the straight-copy NEON list forms, which move bytes and
      # need no lane model.
      #
      # x86-64 is the only one below 1.0 now, and what is left of it is HLT in
      # alignment padding. It stays uncovered rather than being wired to a
      # pseudo-asm call that would move the number without changing what the
      # decompiler emits.
      - name: COV-01 instruction coverage per architecture
        if: always()
        run: |
          CS="build/linux/deps/install/capstone"
          if [ ! -f "$CS/include/capstone/capstone.h" ]; then
            echo "COV-01: capstone install prefix not found at $CS"; exit 1
          fi
          set -o pipefail
          rc=0
          python3 scripts/ci/check_instruction_coverage.py \
            --corpus /tmp/ma-corpus --capstone-prefix "$CS" --top 8 \
            --arch-min "x86_64=0.9931 arm=1.0 arm64=1.0 mips=1.0 powerpc=1.0" \
            2>&1 | tee /tmp/cov01.log || rc=$?
          {
            echo "### COV-01 instruction coverage per architecture"
            echo '```'
            cat /tmp/cov01.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # COV-01 again, over a STATICALLY linked corpus, x86-64 only.
      #
      # The step above measures the 210-binary dynamic corpus, where x86-64
      # reads 0.9931 with one uncovered kind. That is a true number about
      # those binaries and a misleading one about the translator: a
      # dynamically linked `hello world` contains almost no code, because the
      # interesting parts live in libc.so.6, which the binary calls rather
      # than contains. The same 42 sources linked with -static are five
      # million instructions instead of thirty thousand, and x86-64 reads
      # 0.9447 over them -- the worst of the five by a wide margin, and the
      # reason the SSE2 and BMI1 batches exist at all.
      #
      # All five now, not just x86-64. It started as x86-64 only on the
      # reasoning that the other four were not worth building 168 more static
      # binaries for; measuring them locally disproved that twice over. arm64
      # read 0.9840, the worst of the four, and the largest single entry in
      # its uncovered list was 17,340 all-zero words that glibc marks as code
      # -- a defect in this measurement, not in the translator, and one that
      # only a static corpus was ever going to show. The measurement is five
      # seconds per architecture; the corpus build is the cost and it is
      # minutes, not tens of minutes.
      #
      # Only x86-64 is floored. The other four go in as measurements first,
      # the same way x86-64 did, and are floored once CI has reported them
      # itself. Local numbers, for the record:
      #
      #   arm     0.9943   (741,430 bytes mapped as data by $d)
      #   arm64   0.9908
      #   mips    0.9954
      #   powerpc 0.9980
      #
      # Floored at what CI itself measured, not at what this container did.
      # The worry was real and the size of it is now known: run 298 decoded
      # 5,230,246 instructions where the local corpus decodes 5,230,330 --
      # 84 apart, because the runner's glibc is not byte-identical. The rate
      # agreed to four decimal places both times and the uncovered-kind count
      # agreed exactly, which is what makes a floor safe here and is also
      # exactly why it went in unfloored first rather than asserting a local
      # number about a machine nobody had asked.
      #
      #   run 298, de44fdb (Batch A)   5230246 decoded   0.9533   78 kinds
      #   run 299, 3d27c30 (Batch B)   5230246 decoded   0.9589   68 kinds
      #   run 300, a936683 (Batch C)   5230246 decoded   0.9598   58 kinds
      #
      # The floor is whatever the last run reported, so it trails the working
      # tree by one commit and never leads it. A floor is raised on evidence
      # from the thing being gated, never on evidence from somewhere else.
      - name: COV-01 instruction coverage (static corpus)
        if: always()
        run: |
          CS="build/linux/deps/install/capstone"
          if [ ! -f "$CS/include/capstone/capstone.h" ]; then
            echo "COV-01: capstone install prefix not found at $CS"; exit 1
          fi
          bash scripts/build_multiarch_corpus.sh --out /tmp/ma-static --link static
          set -o pipefail
          rc=0
          python3 scripts/ci/check_instruction_coverage.py \
            --corpus /tmp/ma-static --capstone-prefix "$CS" --top 16 \
            --arch-min "x86_64=0.9598" \
            2>&1 | tee /tmp/cov01-static.log || rc=$?
          {
            echo "### COV-01 instruction coverage (static corpus)"
            echo '```'
            cat /tmp/cov01-static.log
            echo '```'
          } | tee -a gate-numbers.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Publish the non-x86 failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch01-failures
          path: |
            arch01-failures
            arch01-full-failures
          if-no-files-found: ignore
          retention-days: 30

      # $GITHUB_STEP_SUMMARY renders in the web UI but is not exposed by the
      # workflow-run API, and this job's log is ~16 MB with the numbers past
      # the window the log API returns. An artifact is the one form of this
      # that a tool can fetch. `if: always()` because a failing gate is
      # exactly when the number is worth reading.
      - name: Publish the measured gate numbers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-numbers
          path: gate-numbers.md
          if-no-files-found: warn
          retention-days: 30

      # The emitted C of whatever CC-01 could not compile. The error names a
      # line in a directory that exists only inside the run, so without this
      # the diagnosis is a guess at which pass produced it -- and two rounds
      # of guessing at `label 'lab_0x112c' used but not defined' picked the
      # wrong pass both times.
      - name: Publish the C that did not compile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cc01-failures
          path: |
            cc01-failures
            cc01-failures-full
          if-no-files-found: ignore
          retention-days: 30

      - name: Filename-rename integrity guard
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          bash scripts/ci/benchmark_rename_guard.sh --decompiler "$DEC" --limit 5 --strict
