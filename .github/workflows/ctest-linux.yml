name: ctest-linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RETDEC_GUI_HEADLESS: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # An LLVM debug build does not fit in the action's 500 MB default, and
      # the key keeps this job's objects out of the other workflows' caches.
      #
      # 2G was still not enough. The first run with the compiler launcher
      # actually wired up (see the Configure step) reported "Cache size (GB):
      # 2.0 / 2.0 (99.97%)" with 92 cleanups and 3 hits out of 3041 calls: the
      # cache filled during the build and evicted each object before anything
      # could reuse it, so the 55-minute build stayed 55 minutes. A debug LLVM
      # plus this tree is roughly 5 GB of objects; 8G leaves room for the next
      # run's misses without thrashing.
      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ctest-linux
          max-size: 8G

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3 \
            python3-yaml \
            perl \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            clang-tidy \
            llvm

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        with:
          cmakeVersion: "3.31.6"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Cache CMake build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Not ~/.cache/ccache: the ccache action above owns that directory,
          # and two actions restoring and saving the same path is how one of
          # them ends up writing an empty cache over the other's.
          path: build/linux
          key: ctest-linux-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/**/CMakeLists.txt') }}
          restore-keys: |
            ctest-linux-

      # The compiler launcher is what makes the ccache step above do anything.
      # Without it nothing invoked ccache at all: this job's own log reported
      # "Cache size (GB): 0.0 / 0.5" and "Not saving cache because no objects
      # are cached" beside a 55-minute build step, on every run. deps/*/
      # forward it into their ExternalProjects, which is where the LLVM build
      # -- almost all of that time -- happens.
      - name: Configure (full-linux-debug, CPU-only CI)
        run: >
          cmake --preset full-linux-debug
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_ENABLE_NEURAL=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build integration targets
        run: >
          cmake --build build/linux --parallel
          --target retdec-decompiler retdec-gui retdec-gui-tests
          format_router_probe retdec-decompiler-fixture-fib
          retdec-decompiler-runtime-share
          retdec-decompiler-corpus-fixtures
          retdec-gui-decompiler-staging

      - name: QUAL-08 ELF hardening (readelf)
        run: python3 scripts/ci/check_elf_hardening.py build/linux

      - name: QUAL-01 clang-tidy (Imortek modules)
        run: python3 scripts/ci/run_clang_tidy.py --compile-commands build/linux/compile_commands.json

      - name: GUI unit tests (headless)
        run: ./build/linux/tests/gui/retdec-gui-tests

      - name: Unit tests
        run: ctest --test-dir build/linux -L unit --output-on-failure

      - name: Integration tests
        run: ctest --test-dir build/linux --output-on-failure -L integration

      - name: Algorithm recovery live F1 (CI core subset)
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          bash scripts/run_algorithm_recovery_ci.sh --decompiler "$DEC"

      - name: CACHE-05 cache-on vs cache-off
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          FIB="$(find build/linux -name fib_smoke -type f | head -n1)"
          if [ -z "$FIB" ]; then echo "fib_smoke fixture not found"; exit 1; fi
          bash scripts/ci/check_cache_differential.sh --decompiler "$DEC" --binary "$FIB"

          CORPUS="tests/algorithm_recovery/corpus"
          mapfile -t NAMES < <(python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              'extract', 'scripts/extract_decompiler_predictions.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print('\n'.join(mod.CI_CORE_NAMES))
          ")
          EXTRA=()
          MISSING=()
          for name in "${NAMES[@]}"; do
            cand=""
            if [ -f "${CORPUS}/${name}" ]; then
              cand="${CORPUS}/${name}"
            elif [ -f "${CORPUS}/${name}.exe" ]; then
              cand="${CORPUS}/${name}.exe"
            else
              cand="$(find build/linux \( -name "${name}" -o -name "${name}.exe" \) -type f 2>/dev/null | head -n1)"
            fi
            if [ -n "${cand}" ] && [ -f "${cand}" ]; then
              EXTRA+=("${cand}")
            else
              MISSING+=("${name}")
            fi
          done
          if [ ${#EXTRA[@]} -eq 0 ]; then
            echo "CACHE-05: skipping ci-core extras — no CI_CORE_NAMES binaries under ${CORPUS} or build/linux (algorithm-recovery should have built the corpus)"
          else
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "CACHE-05: ${#MISSING[@]} ci-core name(s) not found, checking ${#EXTRA[@]} present: ${MISSING[*]}"
            fi
            ARGS=()
            for b in "${EXTRA[@]}"; do
              ARGS+=(--binary "$b")
            done
            bash scripts/ci/check_cache_differential.sh --decompiler "$DEC" --timeout 90 "${ARGS[@]}"
          fi

      # `llvm` above is what puts llvm-symbolizer on $PATH; without it LLVM's
      # crash handler falls back to dladdr and every frame of a crashing
      # decompile prints as a bare address.
      - name: DET-01 decompiler output determinism
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          # The algorithm-recovery step above builds the whole corpus (every
          # source at O0/O2/O3 with both gcc and clang), so this sweeps shapes
          # CACHE-05 never sees: it only checks nine gcc -O0 names, and the HLL
          # copy-propagation passes do not even go parallel below twenty-four
          # functions.  A third of the corpus, evenly spread so every compiler
          # and optimisation level is represented.
          bash scripts/ci/check_output_determinism.sh \
            --decompiler "$DEC" \
            --corpus tests/algorithm_recovery/corpus \
            --limit 72 --timeout 120

      - name: CC-01 emitted C compiles
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          # Nothing in this repository had ever handed the emitted C to a
          # compiler -- DET-01 checks two runs agree, CACHE-05 that the cache
          # does not change it, the recovery gate that the detections are
          # right, and all three read it as text.  README reports 0/216
          # recompiling; the first run of this step, on d9e8108, measured
          # 21/24 (0.8750) on this slice, so that number is the floor rather
          # than a guess.  The three that failed were two distinct defects:
          # a goto whose label the goto-CFG optimiser dropped, and calls
          # emitted with more arguments than the <stdio.h> prototype the same
          # file includes.  Raise the floor with each one fixed.
          bash scripts/ci/check_emitted_c_compiles.sh \
            --decompiler "$DEC" \
            --corpus tests/algorithm_recovery/corpus \
            --limit 24 --timeout 120 --min-rate 0.8750

      - name: Filename-rename integrity guard
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          bash scripts/ci/benchmark_rename_guard.sh --decompiler "$DEC" --limit 5 --strict
