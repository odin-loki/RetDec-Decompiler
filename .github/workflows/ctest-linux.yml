name: ctest-linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RETDEC_GUI_HEADLESS: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3 \
            python3-yaml \
            perl \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            clang-tidy

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        with:
          cmakeVersion: "3.31.6"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Cache CMake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux
            ~/.cache/ccache
          key: ctest-linux-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/deps.cmake', 'cmake/**') }}
          restore-keys: |
            ctest-linux-

      - name: Configure (full-linux-debug, CPU-only CI)
        run: >
          cmake --preset full-linux-debug
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_ENABLE_NEURAL=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build integration targets
        run: >
          cmake --build build/linux --parallel
          --target retdec-decompiler retdec-gui retdec-gui-tests
          format_router_probe retdec-decompiler-fixture-fib
          retdec-decompiler-runtime-share
          retdec-decompiler-corpus-fixtures
          retdec-gui-decompiler-staging

      - name: QUAL-08 ELF hardening (readelf)
        run: python3 scripts/ci/check_elf_hardening.py build/linux

      - name: QUAL-01 clang-tidy (Imortek modules)
        run: python3 scripts/ci/run_clang_tidy.py --compile-commands build/linux/compile_commands.json

      - name: GUI unit tests (headless)
        run: ./build/linux/tests/gui/retdec-gui-tests

      - name: Unit tests
        run: ctest --test-dir build/linux -L unit --output-on-failure

      - name: Integration tests
        run: ctest --test-dir build/linux --output-on-failure -L integration

      - name: Algorithm recovery live F1 (CI core subset)
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          bash scripts/run_algorithm_recovery_ci.sh --decompiler "$DEC"

      - name: CACHE-05 cache-on vs cache-off
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          FIB="$(find build/linux -name fib_smoke -type f | head -n1)"
          if [ -z "$FIB" ]; then echo "fib_smoke fixture not found"; exit 1; fi
          bash scripts/ci/check_cache_differential.sh --decompiler "$DEC" --binary "$FIB"

          CORPUS="tests/algorithm_recovery/corpus"
          mapfile -t NAMES < <(python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              'extract', 'scripts/extract_decompiler_predictions.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print('\n'.join(mod.CI_CORE_NAMES))
          ")
          EXTRA=()
          MISSING=()
          for name in "${NAMES[@]}"; do
            cand=""
            if [ -f "${CORPUS}/${name}" ]; then
              cand="${CORPUS}/${name}"
            elif [ -f "${CORPUS}/${name}.exe" ]; then
              cand="${CORPUS}/${name}.exe"
            else
              cand="$(find build/linux \( -name "${name}" -o -name "${name}.exe" \) -type f 2>/dev/null | head -n1)"
            fi
            if [ -n "${cand}" ] && [ -f "${cand}" ]; then
              EXTRA+=("${cand}")
            else
              MISSING+=("${name}")
            fi
          done
          if [ ${#EXTRA[@]} -eq 0 ]; then
            echo "CACHE-05: skipping ci-core extras — no CI_CORE_NAMES binaries under ${CORPUS} or build/linux (algorithm-recovery should have built the corpus)"
          else
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "CACHE-05: ${#MISSING[@]} ci-core name(s) not found, checking ${#EXTRA[@]} present: ${MISSING[*]}"
            fi
            ARGS=()
            for b in "${EXTRA[@]}"; do
              ARGS+=(--binary "$b")
            done
            bash scripts/ci/check_cache_differential.sh --decompiler "$DEC" --timeout 90 "${ARGS[@]}"
          fi

      - name: Filename-rename integrity guard
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          bash scripts/ci/benchmark_rename_guard.sh --decompiler "$DEC" --limit 5
