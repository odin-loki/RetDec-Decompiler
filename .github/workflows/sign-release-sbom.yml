name: sign-release-sbom

# REL-05 leftover: artefacts uploaded from the v2.0.21 tag before cosign
# landed on that workflow. Keyless-sign published CycloneDX JSON and the
# Linux tarball when the matching .sigstore.json bundle is missing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose artefacts should be signed
        required: false
        default: v2.0.21
  push:
    branches: [main]
    paths:
      - ".github/workflows/sign-release-sbom.yml"

permissions:
  contents: write
  id-token: write

jobs:
  sign-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published CycloneDX if unsigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v2.0.21' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          gh release download "${TAG}" --pattern 'retdec-*.cdx.json' --dir /tmp/rel
          json="$(find /tmp/rel -name 'retdec-*.cdx.json' | head -n1)"
          test -n "${json}" || { echo "no CycloneDX JSON on ${TAG}"; exit 1; }
          base="$(basename "${json}")"
          bundle="${base}.sigstore.json"
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx "${bundle}"; then
            echo "already signed: ${bundle}"
            exit 0
          fi
          cosign sign-blob --yes --bundle "/tmp/rel/${bundle}" "${json}"
          gh release upload "${TAG}" "/tmp/rel/${bundle}"
          echo "uploaded ${bundle} to ${TAG}"

  sign-linux-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published Linux tarball if unsigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v2.0.21' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          gh release download "${TAG}" --pattern 'retdec-*-linux-x64.tar.gz' --dir /tmp/rel
          tb="$(find /tmp/rel -name 'retdec-*-linux-x64.tar.gz' | head -n1)"
          test -n "${tb}" || { echo "no Linux tarball on ${TAG}"; exit 1; }
          base="$(basename "${tb}")"
          bundle="${base}.sigstore.json"
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx "${bundle}"; then
            echo "already signed: ${bundle}"
            exit 0
          fi
          cosign sign-blob --yes --bundle "/tmp/rel/${bundle}" "${tb}"
          gh release upload "${TAG}" "/tmp/rel/${bundle}"
          echo "uploaded ${bundle} to ${TAG}"

  sign-windows-installers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published Windows zip and NSIS if unsigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v2.0.21' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          signed=0
          for pattern in \
            'retdec-*-windows-x64-portable.zip' \
            'retdec-*-windows-x64-setup.exe'
          do
            gh release download "${TAG}" --pattern "${pattern}" --dir /tmp/rel
          done
          shopt -s nullglob
          blobs=(/tmp/rel/retdec-*-windows-x64-portable.zip /tmp/rel/retdec-*-windows-x64-setup.exe)
          if [[ ${#blobs[@]} -eq 0 ]]; then
            echo "no Windows zip/NSIS on ${TAG}"
            exit 1
          fi
          for blob in "${blobs[@]}"; do
            base="$(basename "${blob}")"
            bundle="${base}.sigstore.json"
            if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx "${bundle}"; then
              echo "already signed: ${bundle}"
              continue
            fi
            cosign sign-blob --yes --bundle "/tmp/rel/${bundle}" "${blob}"
            gh release upload "${TAG}" "/tmp/rel/${bundle}"
            echo "uploaded ${bundle} to ${TAG}"
            signed=1
          done
          echo "windows sign pass done (new_bundles=${signed})"
