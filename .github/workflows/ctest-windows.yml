name: ctest-windows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

env:
  RETDEC_GUI_HEADLESS: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Fetch large support files
        shell: pwsh
        run: |
          .\scripts\fetch-large-files.ps1
          if ($LASTEXITCODE -ne 0) {
            .\scripts\fetch-large-files.ps1 -BaseUrl "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Strawberry Perl
        run: choco install strawberryperl -y --no-progress

      - name: Install Qt 6 (MSVC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          archives: qtbase qtsvg

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build/windows
          key: ctest-windows-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**', 'deps/**') }}
          restore-keys: |
            ctest-windows-

      - name: Configure (full-windows-debug, CPU-only CI)
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          cmake --preset full-windows-debug `
            -DRETDEC_ENABLE_CUDA_ACCEL=OFF

      - name: Build googletest
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          cmake --build build/windows --parallel --target googletest
          if ($LASTEXITCODE -ne 0) { throw "googletest build failed" }
          # MSVC Debug ninja expects gtestd.lib; current googletest installs gtest.lib.
          $gdir = "build/windows/deps/install/googletest/lib"
          foreach ($n in @("gtest", "gtest_main", "gmock", "gmock_main")) {
            $src = Join-Path $gdir "$n.lib"
            $dst = Join-Path $gdir "${n}d.lib"
            if ((Test-Path -LiteralPath $src) -and -not (Test-Path -LiteralPath $dst)) {
              Copy-Item -LiteralPath $src -Destination $dst
              Write-Host "Mapped $n.lib -> ${n}d.lib for Debug Ninja"
            }
          }

      - name: Build integration targets
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          cmake --build build/windows --parallel `
            --target retdec-decompiler retdec-gui retdec-gui-tests `
            fileinfo format_router_probe retdec-decompiler-fixture-fib

      - name: Install (for install_smoke)
        shell: pwsh
        run: |
          # Full cmake --install also installs ExternalProjects that this job
          # never built (yaramod include/). Stage the three smoke binaries
          # from the build tree instead.
          $dest = "install/windows/bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $gui = Get-ChildItem -Recurse -Filter retdec-gui.exe -Path build/windows |
            Select-Object -First 1
          $dec = Get-ChildItem -Recurse -Filter retdec-decompiler.exe -Path build/windows |
            Select-Object -First 1
          $fi = Get-ChildItem -Recurse -Filter retdec-fileinfo.exe -Path build/windows |
            Select-Object -First 1
          if (-not $gui -or -not $dec -or -not $fi) {
            throw "missing retdec-gui/decompiler/fileinfo under build/windows"
          }
          Copy-Item -Path (Join-Path $gui.DirectoryName "*") -Destination $dest -Force
          Copy-Item -LiteralPath $dec.FullName -Destination $dest -Force
          Copy-Item -LiteralPath $fi.FullName -Destination $dest -Force
          Write-Host "Staged $($gui.Name), $($dec.Name), $($fi.Name) into $dest"

      - name: GUI unit tests (headless)
        run: .\build\windows\tests\gui\retdec-gui-tests.exe

      - name: Unit tests
        run: ctest --test-dir build/windows -L unit --output-on-failure

      - name: Integration tests
        run: ctest --test-dir build/windows --output-on-failure -L integration
