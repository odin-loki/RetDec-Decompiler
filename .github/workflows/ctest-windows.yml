name: ctest-windows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

env:
  RETDEC_GUI_HEADLESS: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch large support files
        shell: pwsh
        run: |
          .\scripts\fetch-large-files.ps1
          if ($LASTEXITCODE -ne 0) {
            .\scripts\fetch-large-files.ps1 -BaseUrl "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # windows-latest ships CPython 3.14; pyc opcode tables cover 3.8–3.12.
          # Pin so managed_formats / corpus hello.pyc stay in that range.
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Strawberry Perl
        run: choco install strawberryperl -y --no-progress

      - name: Install Qt 6 (MSVC x64)
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          archives: qtbase qtsvg

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "3.31.6"

      - name: Cache CMake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/windows
          key: ctest-windows-py312-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**', 'deps/**') }}
          restore-keys: |
            ctest-windows-py312-
            ctest-windows-

      - name: Configure (full-windows-debug, CPU-only CI)
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          $py = Join-Path $env:pythonLocation "python.exe"
          if (-not (Test-Path -LiteralPath $py)) { throw "setup-python 3.12 missing: $py" }
          cmake --preset full-windows-debug `
            -DRETDEC_ENABLE_CUDA_ACCEL=OFF `
            -DRETDEC_ENABLE_NEURAL=OFF `
            -DPython3_ROOT_DIR="$env:pythonLocation" `
            -DPython3_EXECUTABLE="$py"

      - name: Build googletest
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          cmake --build build/windows --parallel --target googletest
          if ($LASTEXITCODE -ne 0) { throw "googletest build failed" }
          # MSVC Debug ninja expects gtestd.lib; current googletest installs gtest.lib.
          $gdir = "build/windows/deps/install/googletest/lib"
          foreach ($n in @("gtest", "gtest_main", "gmock", "gmock_main")) {
            $src = Join-Path $gdir "$n.lib"
            $dst = Join-Path $gdir "${n}d.lib"
            if ((Test-Path -LiteralPath $src) -and -not (Test-Path -LiteralPath $dst)) {
              Copy-Item -LiteralPath $src -Destination $dst
              Write-Host "Mapped $n.lib -> ${n}d.lib for Debug Ninja"
            }
          }

      - name: Build integration targets
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          cmake --build build/windows --parallel `
            --target retdec-decompiler retdec-gui retdec-gui-tests `
            fileinfo format_router_probe retdec-decompiler-fixture-fib `
            retdec-decompiler-runtime-share `
            retdec-decompiler-corpus-fixtures `
            retdec-gui-decompiler-staging

      - name: Install (for install_smoke)
        shell: pwsh
        run: |
          # Full cmake --install also installs ExternalProjects that this job
          # never built (yaramod include/). Stage the three smoke binaries
          # from the build tree instead.
          $dest = "install/windows/bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $gui = Get-ChildItem -Recurse -Filter retdec-gui.exe -Path build/windows |
            Select-Object -First 1
          $dec = Get-ChildItem -Recurse -Filter retdec-decompiler.exe -Path build/windows |
            Select-Object -First 1
          $fi = Get-ChildItem -Recurse -Filter retdec-fileinfo.exe -Path build/windows |
            Select-Object -First 1
          if (-not $gui -or -not $dec -or -not $fi) {
            throw "missing retdec-gui/decompiler/fileinfo under build/windows"
          }
          Copy-Item -Path (Join-Path $gui.DirectoryName "*") -Destination $dest -Force
          Copy-Item -LiteralPath $dec.FullName -Destination $dest -Force
          Copy-Item -LiteralPath $fi.FullName -Destination $dest -Force
          $share = "install/windows/share/retdec"
          New-Item -ItemType Directory -Force -Path (Join-Path $share "profiles") | Out-Null
          Copy-Item -LiteralPath "src/retdec-decompiler/decompiler-config.json" -Destination $share -Force
          Copy-Item -Path "src/retdec-decompiler/profiles/*.json" -Destination (Join-Path $share "profiles") -Force
          Write-Host "Staged $($gui.Name), $($dec.Name), $($fi.Name) into $dest"
          Write-Host "Staged decompiler-config.json into $share"

      # The first Windows run that ever got this far sat at this step for 47
      # minutes printing nothing, and with timeout-minutes: 360 on the job it
      # would have sat there for six hours. Worse: a job that has not finished
      # has no log archive, so the only readable thing was the tail the API
      # returns, and that tail starts wherever the size cap falls -- for that
      # job, somewhere inside OpenSSL's compile.
      #
      # The bounded version answered the first question immediately:
      # --gtest_list_tests printed all 200-odd tests, so the binary starts, it
      # loads its DLLs, and what hangs is a test body.
      #
      # Which one cannot be read off a single bounded run. gtest writes to
      # stdout, the CRT fully buffers a redirected stream, and killing the
      # process throws that buffer away -- so the "[ RUN ] Name" line naming
      # the hung test is exactly what does not survive. Running one process per
      # test suite does not depend on buffering at all: the suite that times
      # out is the one that timed out.
      - name: GUI unit tests (headless)
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $exe = (Resolve-Path ".\build\windows\tests\gui\retdec-gui-tests.exe").Path
          Write-Host "--- beside the exe ---"
          Get-ChildItem (Split-Path $exe) -Name | Sort-Object | Out-Host

          # Everything the child wrote goes out through Write-Host. Piping
          # Get-Content into the output stream instead makes it part of this
          # function's RETURN VALUE, which is how the first version of this
          # step reported "rc=" followed by the entire list of tests.
          function Invoke-Bounded {
            param([string]$Label, [string[]]$ArgList, [int]$Seconds, [string]$OutFile)
            $err = Join-Path $env:RUNNER_TEMP "$Label.err"
            $p = Start-Process -FilePath $exe -ArgumentList $ArgList -PassThru `
                   -NoNewWindow -RedirectStandardOutput $OutFile -RedirectStandardError $err
            $done = $p.WaitForExit($Seconds * 1000)
            # The no-argument overload after the timed one is what makes
            # ExitCode and the redirected streams reliable.
            if ($done) {
              $p.WaitForExit()
            } else {
              Write-Host "::error::$Label did not finish in $Seconds s -- killing it"
              Stop-Process -Id $p.Id -Force
              Start-Sleep -Seconds 2
            }
            if (Test-Path $err) { Get-Content $err | ForEach-Object { Write-Host $_ } }
            if (-not $done) { return 124 }
            return [int]$p.ExitCode
          }

          # Loads every DLL and runs no test body: if this fails, the problem
          # is starting the binary, not any test in it.
          $list = Join-Path $env:RUNNER_TEMP "gtest-list.out"
          $rc = Invoke-Bounded "gtest-list" @("--gtest_list_tests") 180 $list
          if ($rc -ne 0) {
            Write-Host "::error::retdec-gui-tests.exe cannot list its tests (rc=$rc)"
            if (Test-Path $list) { Get-Content $list | ForEach-Object { Write-Host $_ } }
            exit 1
          }

          $suites = @()
          foreach ($line in (Get-Content $list)) {
            if ($line -match '^(\S+)\.\s*$') { $suites += $Matches[1] }
          }
          if ($suites.Count -eq 0) {
            Write-Host "::error::--gtest_list_tests named no test suite"
            Get-Content $list | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "--- $($suites.Count) test suite(s), one process each ---"

          $hung = @()
          $failed = @()
          foreach ($s in $suites) {
            $safe = $s -replace '[^A-Za-z0-9_]', '_'
            $o = Join-Path $env:RUNNER_TEMP "suite-$safe.out"
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $rc = Invoke-Bounded "suite-$safe" @("--gtest_color=no", "--gtest_filter=$s.*") 120 $o
            $sw.Stop()
            $secs = [math]::Round($sw.Elapsed.TotalSeconds, 1)
            if ($rc -eq 0) {
              Write-Host ("  {0,-48} ok   {1,7}s" -f $s, $secs)
            } else {
              $what = if ($rc -eq 124) { "HUNG" } else { "FAIL" }
              Write-Host ("  {0,-48} {1} {2,7}s  rc={3}" -f $s, $what, $secs, $rc)
              if ($rc -eq 124) { $hung += $s } else { $failed += $s }
              if (Test-Path $o) { Get-Content $o | ForEach-Object { Write-Host $_ } }
            }
          }

          if ($hung.Count -gt 0) { Write-Host "::error::hung: $($hung -join ', ')" }
          if ($failed.Count -gt 0) { Write-Host "::error::failed: $($failed -join ', ')" }
          if ($hung.Count -gt 0 -or $failed.Count -gt 0) { exit 1 }
          Write-Host "all $($suites.Count) GUI test suite(s) passed"

      - name: Unit tests
        shell: pwsh
        run: |
          $py = Join-Path $env:pythonLocation "python.exe"
          if (-not (Test-Path -LiteralPath $py)) { $py = "python" }
          # Same interpreter CMake/ctest use; --user can miss that prefix.
          & $py -m pip install pyyaml
          ctest --test-dir build/windows -L unit --output-on-failure --timeout 600

      - name: Integration tests
        run: ctest --test-dir build/windows --output-on-failure -L integration --timeout 600
