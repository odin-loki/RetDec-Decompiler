# Fast dependency-free gate.
#
# The normal ctest workflows build LLVM, Capstone, Keystone, YARA and YaraMod
# from source, which takes hours.  This job compiles the 62 src/ modules that
# need nothing but a C++17 compiler and runs their existing unit suites against
# the shim in tests/standalone/gtest/, so a pull request gets a real
# compile-and-test signal in about a minute.
#
# It is a supplement to, not a replacement for, ctest-linux / ctest-windows.
name: standalone-check

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: ${{ matrix.cxx }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v7

      # src/gui is 37 sources and 493 tests behind find_package(Qt6 REQUIRED),
      # so without these packages the gui suite skips itself and the GUI stays
      # uncompiled by anything on this runner. moc and rcc come from
      # qt6-base-dev-tools; the offscreen platform plugin is what lets the
      # widget tests run with no display.
      - name: Install Qt6 for the gui suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-base-dev-tools

      - name: Compile every dependency-free module and run its tests
        env:
          CXX: ${{ matrix.cxx }}
        run: ./scripts/standalone_check.sh

      # Guards the hard-coded module list in the script against drift: a module
      # that gains a third-party dependency, or a new dependency-free module
      # that nobody added to the fast path, both fail here.
      - name: Audit the dependency-free module list
        env:
          CXX: ${{ matrix.cxx }}
        run: ./scripts/standalone_check.sh --audit

  system-llvm:
    name: system-LLVM suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Neither of these builds the pinned llvm-project -- that is a multi-hour
      # job the ctest workflows do.  They build the two parts of the tree that
      # need only the stable LLVM headers, so the suites behind RETDEC_TESTS
      # get a signal on every push instead of on none.  gtest/gmock come from
      # apt because tests/llvmir2hll uses TEST_F, MOCK_METHOD and gmock
      # matchers, which the tests/standalone shim does not implement.
      #
      # llvm-20-dev, not llvm-dev.  `llvm-dev` is whatever the runner image
      # defaults to -- 18.1.3 on ubuntu-24.04 -- and "whatever the runner
      # ships" is not a toolchain, it is a thing that changes under you. It
      # already did: a test written and verified against LLVM 20 went red here
      # on 18, because the two fold an out-of-bounds constant GEP index
      # differently, and four of the checks below refuse to run under 20 at
      # all. The capstone2llvmir job a few lines down has installed
      # llvm-20-dev all along, so the two halves of this workflow were
      # measuring different compilers.
      - name: Install LLVM 20, gtest and Capstone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-20-dev libgtest-dev libgmock-dev libcapstone-dev \
                                      opencl-headers ocl-icd-opencl-dev pocl-opencl-icd

      # ADAPT-01. src/retdec/llvm_to_ssa.cpp is the single producer of the SSA
      # every structural detector consumes, and its tests were built by nothing.
      - name: ADAPT-01 llvm_to_ssa adapter
        run: bash scripts/ci/check_llvm_adapter.sh

      # L2H-01. tests/llvmir2hll is 2179 assertions over the component that
      # writes the decompiler's C output, and none of them ran anywhere. 386 of
      # them are tests/llvmir2hll/llvm, which this check excluded until the
      # stated reason -- LLVM APIs that moved -- was measured and came to three
      # lines rather than a directory.
      #
      # An earlier version of this comment blamed RETDEC_TESTS:BOOL=OFF. That
      # was wrong -- the full-linux-debug preset has set RETDEC_TESTS to ON
      # since 2026-08-25, overriding the OFF in _optionDefaults. The real
      # reasons are two, and both were measured with a two-test probe project:
      #
      #   1. ctest-linux's build step names its targets explicitly and no test
      #      target is among them, so the suite is never compiled. An unbuilt
      #      gtest_discover_tests target shows up under plain `ctest -N` as
      #      `<target>_NOT_BUILT`.
      #   2. gtest_discover_tests attaches NO labels unless asked, and the
      #      "Unit tests" step runs `ctest -L unit`. The NOT_BUILT placeholder
      #      is unlabelled, so `-L unit` does not select it -- and neither are
      #      the real test cases once the target IS built.
      #
      # So `ctest -L unit` selects only the three tests/ directories that set
      # LABELS themselves (decompiler, managed_integration, neural). Every
      # module suite under tests/ is invisible to it.
      #
      # That was written down here and left standing. It is fixed now, on the
      # one job that builds the whole tree: ctest-macos runs `ctest` with no
      # -L, which is the whole registered set, and TESTSEL-01 in ci-smoke
      # fails if any registered test goes back to being selected by nothing.
      # ctest-linux and ctest-windows still name their build targets
      # explicitly, so reason 1 above still holds for them.
      - name: L2H-01 llvmir2hll suite
        run: bash scripts/ci/check_llvmir2hll_tests.sh --jobs 4

      # SEM-01. src/sem_decoder needs <capstone/capstone.h>, so
      # standalone_check.sh lists it in EXCLUDED_REASONS -- and that silently
      # took its 45 test cases with it, because nothing else runs them either
      # (see the two reasons above). The decoder that turns machine code into
      # semantic IR had no gate at all.
      - name: SEM-01 sem_decoder suite
        run: bash scripts/ci/check_sem_decoder_tests.sh

      # DEM-01. tests/demangler is 125 assertions over the component every C++
      # symbol in a binary reaches the output through, and it ran nowhere for
      # the same two reasons as L2H-01. src/compiler_abi carries a second,
      # hand-written Itanium parser whose length accumulator overflowed an int;
      # that one was found because compiler_abi IS in a gate.
      - name: DEM-01 demangler suite
        run: bash scripts/ci/check_demangler_tests.sh

      # FF-01. tests/cpdetect, tests/loader and tests/fileformat -- 209
      # assertions over the layer that turns a file on disk into sections,
      # segments and symbols. 157 of them ran nowhere before this step existed,
      # for the same two reasons as L2H-01: standalone_check.sh skips anything
      # needing a third-party library, and ctest-linux builds no test target.
      # src/fileformat was assumed to need the pinned llvm-project; it needs
      # llvm/Object/COFF.h and a few llvm/Support headers, which llvm-dev
      # provides, and stb, tlsh and authenticode-parser, which are vendored in
      # deps/ with sources.
      #
      # tests/fileformat was added last and was the largest of the three: 83 of
      # its 129 cases ran nowhere, because standalone_check.sh builds the four
      # files that need no LLVM and CI builds no test target at all. Eleven of
      # the twelve it left were recorded as "not carried through the LLVM
      # 23.1.0 migration"; all eleven compile and pass against llvm-dev.
      #
      # tests/unpacker stays out: it links retdec::cpdetect, which needs YARA.
      - name: FF-01 fileformat-backed suites
        run: bash scripts/ci/check_fileformat_tests.sh --jobs 4

      # ARITY-01. The arity tables the C writer trims and casts calls against
      # are measured from the real headers, not recalled -- a wrong entry would
      # silently delete a real argument from the emitted C, or cast a call that
      # did not need it. There is one per semantics that assigns C headers:
      # libc (454 entries) and gcc_general (976), the latter because it is the
      # one that knows <pthread.h>. This fails if a table and the headers ever
      # disagree.
      - name: ARITY-01 libc arity table vs the C headers
        run: python3 scripts/ci/check_libc_arity.py --check --jobs 4

      # OCL-01. src/opencl is 4,547 lines and tests/opencl is eight suites, and
      # no build of this repository compiled either -- both carry a complete
      # CMakeLists.txt that no add_subdirectory names. The audit entry that
      # recorded that blamed find_package(OpenCL REQUIRED), which is a fact
      # about CMake and not about the sources: they need <CL/cl.h>, the
      # standard library and their own headers, and nothing else. Compiling
      # them found a file that had never compiled, three kernels that had never
      # built, and a rewrite rule that could only ever fire for a shift of
      # zero. POCL supplies the device, so the GPU half runs rather than
      # skipping.
      - name: OCL-01 opencl library, kernels and suites
        run: bash scripts/ci/check_opencl_tests.sh --self-test

      # CFGOPT-01. A config field with a default and a doc comment is a promise
      # that setting it changes something. Three on this branch did not keep it
      # and each was a real defect -- StringDetectorConfig's three dead detect*
      # switches, DVSA::Result::carvedAccesses, and
      # AbiArtifactMarker::Config::arm32/aarch64, where the flag that would
      # have stopped ARM32's scratch register being marked callee-saved existed
      # and nothing read it. This stops the class growing.
      # Named CFGOPT-01 rather than OPT-01: OPT-01 is the bin2llvmir rewrite
      # semantics differ (scripts/ci/check_bin2llvmir_opts.sh), which prints
      # that identifier and carries a row in docs/CLAIMS.md under it. Two
      # checks sharing an identifier makes "OPT-01 failed" point at the wrong
      # one, which is the sort of thing a claims register exists to prevent.
      - name: CFGOPT-01 no new unread option fields
        run: python3 scripts/ci/check_unread_options.py --check

      # OPT-01. bin2llvmir is where the lifted IR gets rewritten, and it had no
      # gate of any kind: the only tests compared IR text for one of its
      # passes, which answers "did the rewrite produce the instruction I wrote
      # down", not "do the two programs compute the same thing". This runs both
      # sides over a domain of inputs with LLVM's own constant folder and
      # requires the same answer.
      #
      # It and IDIOM-PHI-01 below ran only from check_push_gates.sh, which no
      # workflow invokes -- so until this step they protected nothing CI
      # enforced. That asymmetry is now checked both ways by
      # `check_push_gates.sh --audit`.
      - name: OPT-01 bin2llvmir rewrite semantics
        run: bash scripts/ci/check_bin2llvmir_opts.sh --self-test

      # IDIOM-PHI-01. IdiomsAnalysis::analyse carries a fix-up for "an
      # exchanger replaced a PHI with a non-PHI" whose correctness rests on a
      # claim about all 39 exchangers. This measures the claim rather than
      # leaving it in a comment to go stale.
      - name: IDIOM-PHI-01 idiom exchangers vs PHI nodes
        run: bash scripts/ci/check_idiom_phi_reach.sh --self-test

      # IDIOM-USE-01. An idiom rewrite erases the inner nodes of the tree it
      # matched. When one of those nodes was also read by something outside the
      # tree, the helper doing the erase replaced that reader's operand with
      # `undef` -- a silent miscompile that verifies clean. This runs the pass
      # over shapes with and without a shared inner node and compares what the
      # function computes before and after.
      - name: IDIOM-USE-01 idiom rewrites vs uses they did not match
        run: bash scripts/ci/check_idiom_shared_use.sh --self-test

      # B2L-01. tests/bin2llvmir is 424 assertions over the layer that rewrites
      # the lifted IR, and none of them ran outside the pinned-LLVM build --
      # including four suites added for passes that had no tests at all, which
      # then joined the passes in not running. Linking them against an archive
      # rather than a flat object list drops the closure from 616 undefined
      # references to 27.
      #
      # It compiles 952 translation units, so it is the slowest step here.
      - name: B2L-01 bin2llvmir suites
        run: bash scripts/ci/check_bin2llvmir_tests.sh --jobs 4 --workdir "$RUNNER_TEMP/b2l" --keep

      # ORPH-01. Sixteen directories under tests/ build a gtest executable and
      # register no test with ctest -- exactly the upstream ones; every test
      # directory this fork added is registered. Nine are covered by a check
      # here instead. Seven were covered by nothing at all: 460 assertions that
      # ran nowhere. They pass. This reuses B2L-01's archive rather than
      # compiling the tree a second time, which is why it shares its workdir.
      - name: ORPH-01 suites ctest never runs
        run: bash scripts/ci/check_orphan_test_suites.sh --b2l-workdir "$RUNNER_TEMP/b2l"

      # L2HW-01. Nothing compiled src/llvmir2hll with warnings on: L2H-01 uses
      # -w because it is there to run the tests, and standalone_check.sh covers
      # only the modules that need no third-party library. So -Wunused-function
      # -- "this code is never called" -- had never been read for 312
      # translation units. It was hiding a 213-line class that was never
      # constructed and two helpers written for it.
      - name: L2HW-01 llvmir2hll warnings
        run: bash scripts/ci/check_llvmir2hll_warnings.sh --jobs 4

  # C2L-01. tests/capstone2llvmir is 4,370 assertions and the only place ARM,
  # ARM64, MIPS and PowerPC instruction semantics are checked at all. It was on
  # standalone_check.sh's UNGATED_SUITES list, evaluated nowhere, for two
  # stated reasons -- LLVM 20+ drift, and Keystone being a download stub. Both
  # are facts about the machine: llvm-20-dev is in Ubuntu noble's universe
  # pocket, and Capstone 5.0.9 and Keystone 0.9.2 (the revisions
  # cmake/deps.cmake pins) build from source in about three minutes. With them
  # present every source compiles and all 4,370 pass, unchanged.
  #
  # Its own job because it wants a different LLVM from the one the
  # system-LLVM suites use, and because the dependency build caches.
  capstone2llvmir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM 20, gtest and cmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-20-dev libgtest-dev libgmock-dev cmake

      # Keyed on the pinned revisions in cmake/deps.cmake, so bumping either
      # one rebuilds rather than silently testing the old library.
      - name: Cache Capstone and Keystone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .c2l-deps
          key: c2l-deps-${{ hashFiles('cmake/deps.cmake') }}

      - name: C2L-01 capstone2llvmir, all five architectures
        run: |
          C2L_DEPS_DIR="$PWD/.c2l-deps" \
            bash scripts/ci/check_capstone2llvmir_tests.sh --self-test

      # PSEUDO-01. COV-01 asks whether the dispatch table has a function
      # pointer for an instruction id; this asks the translator whether what it
      # produced was a pseudo-assembly call. The two are not the same question,
      # and over the 210-binary parity corpus COV-01 reads 1.0000 for ARM,
      # ARM64, MIPS and PowerPC while three of those four emit unmodelled
      # __asm_* calls:
      #
      #   arm64    __asm_movi                      1
      #   mips     __asm_trunc.w.d                12
      #   powerpc  __asm_rlwinm                   42
      #
      # It lives in this job because it wants the same three things C2L-01
      # does -- system LLVM 20, the pinned Capstone, and the translator sources
      # compiled against them -- and it needs a corpus on top, which is the
      # cross toolchains below and about a minute of linking.
      #
      # Floored at what CI itself measured. Run 194 at 2ee4ef3 reported the
      # same five numbers this container does, to four decimal places and with
      # the same per-instruction counts, which is what makes the floor safe:
      #
      #   x86_64  1.0000   arm 1.0000   arm64 0.9999   mips 0.9999   powerpc 0.9993
      #
      # x86-64 and ARM are floored at 1.0000, which means any instruction that
      # stops being translated on either fails this step -- including one that
      # keeps its function pointer, which is the case COV-01 cannot see.
      - name: Install cross toolchains for the parity corpus
        run: |
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-mips-linux-gnu gcc-powerpc-linux-gnu \
            libc6-dev-arm64-cross libc6-dev-armhf-cross \
            libc6-dev-mips-cross libc6-dev-powerpc-cross

      - name: PSEUDO-01 pseudo-assembly calls per architecture
        run: |
          bash scripts/build_multiarch_corpus.sh --out /tmp/ma-corpus
          bash scripts/ci/check_pseudo_asm.sh --self-test \
            --capstone-prefix "$PWD/.c2l-deps/capstone-install" \
            --corpus /tmp/ma-corpus --top 10 \
            --arch-min "x86_64=1.0 arm=1.0 arm64=0.9999 mips=0.9999 powerpc=1.0"

      # FLAG-01 asks the question none of the coverage checks do: not whether
      # an instruction is translated, but whether it is translated CORRECTLY.
      # It executes each one on the runner's own CPU and compares the result
      # and every flag against the translator's IR. The runners are x86-64; on
      # anything else the script skips.
      #
      # Three comparisons: the one-register arithmetic, the two-register forms
      # (MUL, DIV, the shifts and rotates -- results as well as flags), and
      # every SETcc against all 64 flag combinations. Six real bugs have come
      # out of it so far, none of which any test in the tree could see.
      - name: FLAG-01 results, flags and condition codes against the hardware
        run: |
          bash scripts/ci/check_x86_flags.sh --self-test \
            --capstone-prefix "$PWD/.c2l-deps/capstone-install" \
            --rows 400

  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 for the gui suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-base-dev-tools

      - name: Run the dependency-free suites under ASan and UBSan
        env:
          CXX: g++
          EXTRA_CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -g -O1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./scripts/standalone_check.sh
