# Fast dependency-free gate.
#
# The normal ctest workflows build LLVM, Capstone, Keystone, YARA and YaraMod
# from source, which takes hours.  This job compiles the 62 src/ modules that
# need nothing but a C++17 compiler and runs their existing unit suites against
# the shim in tests/standalone/gtest/, so a pull request gets a real
# compile-and-test signal in about a minute.
#
# It is a supplement to, not a replacement for, ctest-linux / ctest-windows.
name: standalone-check

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: ${{ matrix.cxx }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      # src/gui is 37 sources and 493 tests behind find_package(Qt6 REQUIRED),
      # so without these packages the gui suite skips itself and the GUI stays
      # uncompiled by anything on this runner. moc and rcc come from
      # qt6-base-dev-tools; the offscreen platform plugin is what lets the
      # widget tests run with no display.
      - name: Install Qt6 for the gui suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-base-dev-tools

      - name: Compile every dependency-free module and run its tests
        env:
          CXX: ${{ matrix.cxx }}
        run: ./scripts/standalone_check.sh

      # Guards the hard-coded module list in the script against drift: a module
      # that gains a third-party dependency, or a new dependency-free module
      # that nobody added to the fast path, both fail here.
      - name: Audit the dependency-free module list
        env:
          CXX: ${{ matrix.cxx }}
        run: ./scripts/standalone_check.sh --audit

  system-llvm:
    name: system-LLVM suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Neither of these builds the pinned llvm-project -- that is a multi-hour
      # job the ctest workflows do.  They build the two parts of the tree that
      # need only the stable LLVM headers, against whatever LLVM the runner
      # ships, so the suites behind RETDEC_TESTS get a signal on every push
      # instead of on none.  gtest/gmock come from apt because
      # tests/llvmir2hll uses TEST_F, MOCK_METHOD and gmock matchers, which the
      # tests/standalone shim does not implement.
      - name: Install LLVM headers, gtest and Capstone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-dev libgtest-dev libgmock-dev libcapstone-dev

      # ADAPT-01. src/retdec/llvm_to_ssa.cpp is the single producer of the SSA
      # every structural detector consumes, and its tests were built by nothing.
      - name: ADAPT-01 llvm_to_ssa adapter
        run: bash scripts/ci/check_llvm_adapter.sh

      # L2H-01. tests/llvmir2hll is 2179 assertions over the component that
      # writes the decompiler's C output, and none of them ran anywhere. 386 of
      # them are tests/llvmir2hll/llvm, which this check excluded until the
      # stated reason -- LLVM APIs that moved -- was measured and came to three
      # lines rather than a directory.
      #
      # An earlier version of this comment blamed RETDEC_TESTS:BOOL=OFF. That
      # was wrong -- the full-linux-debug preset has set RETDEC_TESTS to ON
      # since 2026-08-25, overriding the OFF in _optionDefaults. The real
      # reasons are two, and both were measured with a two-test probe project:
      #
      #   1. ctest-linux's build step names its targets explicitly and no test
      #      target is among them, so the suite is never compiled. An unbuilt
      #      gtest_discover_tests target shows up under plain `ctest -N` as
      #      `<target>_NOT_BUILT`.
      #   2. gtest_discover_tests attaches NO labels unless asked, and the
      #      "Unit tests" step runs `ctest -L unit`. The NOT_BUILT placeholder
      #      is unlabelled, so `-L unit` does not select it -- and neither are
      #      the real test cases once the target IS built.
      #
      # So `ctest -L unit` selects only the three tests/ directories that set
      # LABELS themselves (decompiler, managed_integration, neural). Every
      # module suite under tests/ is invisible to it.
      - name: L2H-01 llvmir2hll suite
        run: bash scripts/ci/check_llvmir2hll_tests.sh --jobs 4

      # SEM-01. src/sem_decoder needs <capstone/capstone.h>, so
      # standalone_check.sh lists it in EXCLUDED_REASONS -- and that silently
      # took its 45 test cases with it, because nothing else runs them either
      # (see the two reasons above). The decoder that turns machine code into
      # semantic IR had no gate at all.
      - name: SEM-01 sem_decoder suite
        run: bash scripts/ci/check_sem_decoder_tests.sh

      # DEM-01. tests/demangler is 125 assertions over the component every C++
      # symbol in a binary reaches the output through, and it ran nowhere for
      # the same two reasons as L2H-01. src/compiler_abi carries a second,
      # hand-written Itanium parser whose length accumulator overflowed an int;
      # that one was found because compiler_abi IS in a gate.
      - name: DEM-01 demangler suite
        run: bash scripts/ci/check_demangler_tests.sh

      # FF-01. tests/cpdetect and tests/loader -- 74 assertions over the layer
      # that turns a file on disk into sections, segments and symbols -- ran
      # nowhere for the same two reasons. src/fileformat was assumed to need
      # the pinned llvm-project; it needs llvm/Object/COFF.h and a few
      # llvm/Support headers, which llvm-dev provides, and stb, tlsh and
      # authenticode-parser, which are vendored in deps/ with sources.
      # tests/unpacker stays out: it links retdec::cpdetect, which needs YARA.
      - name: FF-01 fileformat-backed suites
        run: bash scripts/ci/check_fileformat_tests.sh --jobs 4

      # ARITY-01. The libc arity table the C writer trims calls against is
      # measured from the real headers, not recalled -- a wrong entry would
      # silently delete a real argument from the emitted C. This fails if the
      # table and the headers ever disagree.
      - name: ARITY-01 libc arity table vs the C headers
        run: python3 scripts/ci/check_libc_arity.py --check --jobs 4

      # OPT-01. A config field with a default and a doc comment is a promise
      # that setting it changes something. Three on this branch did not keep it
      # and each was a real defect -- StringDetectorConfig's three dead detect*
      # switches, DVSA::Result::carvedAccesses, and
      # AbiArtifactMarker::Config::arm32/aarch64, where the flag that would
      # have stopped ARM32's scratch register being marked callee-saved existed
      # and nothing read it. This stops the class growing.
      - name: OPT-01 no new unread option fields
        run: python3 scripts/ci/check_unread_options.py --check

  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 for the gui suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-base-dev-tools

      - name: Run the dependency-free suites under ASan and UBSan
        env:
          CXX: g++
          EXTRA_CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -g -O1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ./scripts/standalone_check.sh
