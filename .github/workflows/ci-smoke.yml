name: ci-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2

      - name: Cache deps prefix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/linux/deps
            ~/.cache/ccache
          key: ci-smoke-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}
          restore-keys: ci-smoke-deps-

      - name: Fetch large support files
        run: |
          for i in 1 2 3; do
            bash scripts/fetch-large-files.sh && exit 0
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main" && exit 0
            echo "fetch-large-files attempt $i failed; retrying..."
            sleep 5
          done
          exit 1

      - name: C++ format check (clang-format)
        timeout-minutes: 5
        run: |
          if [[ ! -f scripts/check_format.sh ]]; then
            echo "scripts/check_format.sh not found — skipping"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y clang-format
          bash scripts/check_format.sh

      # A workflow GitHub cannot parse does not fail: it does not run at all,
      # and every scheduled and push trigger in that file quietly stops. This
      # file is one of them, so the check goes first among the cheap ones.
      # yaml.safe_load() is not enough on its own -- it takes the last of a
      # repeated key and says nothing, which is how a duplicate reached this
      # branch and was found only by trying to dispatch the run it had broken.
      - name: Every workflow parses, with no duplicate keys
        run: python3 scripts/ci/check_workflow_yaml.py

      # A source list that names a deleted file fails the configure outright,
      # and the targets that would notice are behind the hours-long LLVM build.
      # This is a file-existence check; it needs no compiler and takes a second.
      - name: Every source a CMake target names exists
        run: bash scripts/check_cmake_sources.sh

      # A preset's cacheVariables reach the configure the way -D does and
      # overwrite the cache; a variable a preset does NOT name keeps whatever
      # the last configure left in that build directory. Six presets share
      # build/linux and four share build/windows, and the cache steps in
      # ctest-linux.yml, sanitizers.yml and coverage.yml carry those
      # directories between workflows. This holds the invariant that makes the
      # sharing safe: presets sharing a directory set the same key set.
      - name: No cache variable can leak between CMake presets
        run: |
          python3 scripts/ci/check_cmake_presets.py --self-test
          python3 scripts/ci/check_cmake_presets.py CMakePresets.json cmake/superbuild/CMakePresets.json

      # An option() nothing reads shows up in ccmake and in cmake -LH with a
      # help string saying what it would do, and does nothing. That is worse
      # than the option not existing.
      - name: Every declared build option is read by the build
        run: |
          python3 scripts/ci/check_cmake_options.py --self-test
          python3 scripts/ci/check_cmake_options.py

      # `debug_enabled` is the LOG switch bin2llvmir passes turn on while
      # debugging, and it belongs to a translation unit: fifteen passes spell it
      # `#define debug_enabled false` in their .cpp. Two public headers defined
      # it as a global variable instead, which made them mutually exclusive --
      # any TU including both is rejected with "redefinition of 'const bool
      # debug_enabled'". A header cannot own this name.
      - name: No header defines the debug_enabled switch
        run: |
          if grep -rn '^[[:space:]]*\(const[[:space:]]\+\)\?bool[[:space:]]\+debug_enabled' include/; then
            echo "::error::a header defines debug_enabled; it is a per-translation-unit switch"
            echo "define it in the .cpp instead: #define debug_enabled false"
            exit 1
          fi
          echo "OK: no header under include/ defines debug_enabled"

      # std::sort compiles without <algorithm> only where some other header
      # happened to pull it in, which is a property of the standard library
      # implementation. Two files in that state failed CI's clang++ the first
      # time standalone-check ran on a working branch.
      - name: No new file uses a std algorithm without including its header
        run: bash scripts/check_std_includes.sh

      - name: CLI helper tests
        run: python scripts/python/test_retdec_cli.py

      - name: Semantic C hint tests
        run: python tests/decompiler/semantic_c_hint_test.py

      - name: Pipeline profile validation
        run: python tests/decompiler/validate_pipeline_test.py

      - name: Semantic detection JSON tests
        run: python tests/decompiler/semantic_detection_json_test.py

      - name: Intel export tests
        run: python tests/decompiler/intel_export_test.py

      - name: Algorithm recovery label tests
        run: python tests/algorithm_recovery/test_labels.py

      - name: Algorithm recovery regression gate tests
        run: python tests/algorithm_recovery/test_regression_gate.py

      - name: Corpus binary resolution tests
        run: python tests/algorithm_recovery/test_corpus_resolve.py

      - name: Decompiler failure summary tests
        run: python tests/algorithm_recovery/test_failure_summary.py

      - name: Triton differential gate smoke
        run: python tests/algorithm_recovery/test_triton_gate.py

      - name: Ship checklist
        run: bash scripts/ship_checklist.sh

      - name: Doctor licence and workflow checks
        run: bash scripts/doctor.sh

      # NOT a regression gate, and it used to be labelled as one. This job has
      # no cmake configure and no build, so run_benchmarks.sh finds no
      # retdec-decompiler, writes its payload with "status": "skipped" and every
      # metric null, and the gate takes the not-measured branch for every key
      # and prints "Benchmark regression gate: PASS". It published a passing
      # regression status on every push while comparing nothing.
      #
      # What it can honestly do without a build is stage the corpus and produce
      # a results JSON. The real gate runs where a decompiler exists --
      # algorithm-recovery-nightly.yml, with --require-measured, so a skipped
      # metric there is a failure rather than a pass.
      - name: Stage the benchmark corpus and write a results JSON
        run: |
          bash scripts/fetch_decompilebench_corpus.sh --profile ci-core
          bash scripts/run_benchmarks.sh --compare 2026-08 --profile ci-core

      - name: Algorithm corpus size check
        run: |
          if command -v gcc >/dev/null 2>&1; then
            bash scripts/build_algorithm_corpus.sh
            COUNT=$(python3 -c "import json; print(len(json.load(open('tests/algorithm_recovery/corpus/manifest.json'))))")
            echo "Corpus binaries: ${COUNT}"
            test "${COUNT}" -ge 200
          else
            echo "gcc not available — skipping corpus build"
          fi
