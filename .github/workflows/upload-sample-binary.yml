name: upload-sample-binary

# REL-07 leftover: gcc -O1 tests/test_binaries/fib.c (same flags as
# retdec-decompiler-fixture-fib) and attach fib_smoke to the Release so
# QUICKSTART can decompile without building LLVM.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to receive fib_smoke
        required: false
        default: v2.0.21
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-sample-binary.yml"
      - "tests/test_binaries/fib.c"
  workflow_run:
    workflows: [release-installers]
    types: [completed]

permissions:
  contents: write
  id-token: write

jobs:
  upload:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build fib_smoke and upload if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag || '' }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_TAG}" ]]; then
            TAG="${DISPATCH_TAG}"
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            TAG="${RUN_BRANCH}"
            if [[ "${TAG}" != v* ]]; then
              echo "release-installers did not run on a v* tag (${TAG}); skip"
              exit 0
            fi
          else
            TAG="v2.0.21"
          fi
          gcc -O1 -o /tmp/fib_smoke tests/test_binaries/fib.c
          test -x /tmp/fib_smoke
          file /tmp/fib_smoke
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx 'fib_smoke'; then
            echo "already on ${TAG}: fib_smoke"
          else
            gh release upload "${TAG}" /tmp/fib_smoke
            echo "uploaded fib_smoke to ${TAG}"
          fi
          bundle="fib_smoke.sigstore.json"
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx "${bundle}"; then
            echo "already signed: ${bundle}"
            exit 0
          fi
          cosign sign-blob --yes --bundle "/tmp/${bundle}" /tmp/fib_smoke
          gh release upload "${TAG}" "/tmp/${bundle}"
          echo "uploaded ${bundle} to ${TAG}"

  upload-windows:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build fib_smoke.exe and upload if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag || '' }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:DISPATCH_TAG) {
            $env:TAG = $env:DISPATCH_TAG
          } elseif ($env:EVENT_NAME -eq "workflow_run") {
            $env:TAG = $env:RUN_BRANCH
            if ($env:TAG -notlike "v*") {
              Write-Host "release-installers did not run on a v* tag ($($env:TAG)); skip"
              exit 0
            }
          } else {
            $env:TAG = "v2.0.21"
          }
          # Same MSVC flags as tests/decompiler/CMakeLists.txt retdec-decompiler-fixture-fib.
          cmd /c "cl /nologo /Od /Ob0 /Oi- /GS- /Oy- /guard:cf- /Fefib_smoke.exe tests\test_binaries\fib.c /link /INCREMENTAL:NO /GUARD:NO /CETCOMPAT:NO /EXPORT:main"
          if ($LASTEXITCODE -ne 0) { throw "cl failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath "fib_smoke.exe")) { throw "fib_smoke.exe missing" }
          $names = gh release view $env:TAG --json assets --jq ".assets[].name"
          if ($names -notmatch '(?m)^fib_smoke\.exe$') {
            gh release upload $env:TAG fib_smoke.exe
            Write-Host "uploaded fib_smoke.exe to $($env:TAG)"
          } else {
            Write-Host "already on $($env:TAG): fib_smoke.exe"
          }
          $bundle = "fib_smoke.exe.sigstore.json"
          if ($names -match '(?m)^fib_smoke\.exe\.sigstore\.json$') {
            Write-Host "already signed: $bundle"
            exit 0
          }
          cosign sign-blob --yes --bundle $bundle fib_smoke.exe
          gh release upload $env:TAG $bundle
          Write-Host "uploaded $bundle to $($env:TAG)"
