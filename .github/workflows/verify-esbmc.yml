# Formal verification of the arithmetic kernels.
#
# scripts/standalone_fuzz.sh shows that a bug exists; it cannot show that one
# does not. The arithmetic every parser depends on -- counts, lengths, offsets,
# indices and encodings read out of untrusted files -- lives in a set of
# header-only kernels under include/retdec/utils/, and this job proves them
# correct for all inputs over the whole 64-bit range with ESBMC and an SMT
# solver. `--syntax` type-checks the harnesses first; `--routing` then checks
# that every proved kernel is still reachable from src/, because a proof about
# a header nothing includes proves nothing about this program.
#
# Scope, the exact kernel and proof counts, and the limits are in
# docs/VERIFICATION.md. In short: the kernels are proved, the parsers around
# them are not, because ESBMC's models of the C++ standard library do not
# stretch to this codebase.
name: verify-esbmc

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    paths:
      # Deliberately the whole directory, not the list of proved headers. The
      # list used to be here and named only bounds.h, which was true when there
      # was one proof and silently wrong for the twelve kernels added after it:
      # a pull request touching scan_cursor.h or text_transcode.h skipped the
      # proofs entirely. A glob cannot go stale that way.
      - 'include/retdec/utils/**'
      # pe_reader_proof.cpp verifies this translation unit itself.
      - 'src/cli_parser/pe_reader.cpp'
      - 'tests/verification/**'
      - 'scripts/verify_esbmc.sh'
      - 'docs/VERIFICATION.md'
      - '.github/workflows/verify-esbmc.yml'
  workflow_dispatch:
  schedule:
    # The full run is minutes of solver time; once a week catches drift in the
    # header even when a pull request does not touch the paths above.
    - cron: "0 5 * * 1"

permissions:
  contents: read

env:
  # The release the harnesses are written against. scripts/verify_esbmc.sh
  # carries the same number as ESBMC_MIN_VERSION and refuses to run below it.
  ESBMC_TAG: v8.5

concurrency:
  group: verify-esbmc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: harness syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Seconds, and it catches a typo in a harness without waiting for the
      # solver job below.
      - name: Type-check the proof harnesses
        run: ./scripts/verify_esbmc.sh --syntax

      # A proof about a header nothing includes proves nothing about this
      # program. This is a grep, so it costs nothing to keep honest.
      - name: Check every proved kernel still has a caller
        run: ./scripts/verify_esbmc.sh --routing

      # docs/VERIFICATION.md leads with a proof count and a table of one row
      # per kernel, and claimed of itself that it could not drift. It had:
      # utils/safe_name.h and its thirteen proofs were missing and the headline
      # read 272 against 286. Re-derived from the harnesses here instead.
      - name: Check docs/VERIFICATION.md against the harnesses
        run: ./scripts/verify_esbmc.sh --doc

  prove:
    name: prove
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      # The tag, not `latest`, and the tag is in the cache key.
      #
      # This used to download releases/latest into a cache keyed on the constant
      # `esbmc-release-v1`, so whichever build first populated the cache was
      # reused indefinitely and an eviction would silently pull a different one.
      # Every --unwind bound in tests/verification/ is a proof only because
      # unwinding assertions are ON BY DEFAULT in this release -- there is no
      # --unwinding-assertions flag to ask for -- so the version is part of the
      # soundness argument. scripts/verify_esbmc.sh refuses to run below
      # ESBMC_MIN_VERSION now, which is the same statement made where the
      # proofs are.
      - name: Cache the ESBMC release build
        id: esbmc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/esbmc
          key: esbmc-${{ env.ESBMC_TAG }}

      # ESBMC is not in the Ubuntu archive, so take the upstream release build.
      - name: Install ESBMC
        if: steps.esbmc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o esbmc-linux.zip \
            "https://github.com/esbmc/esbmc/releases/download/${ESBMC_TAG}/esbmc-linux.zip"
          unzip -q esbmc-linux.zip
          mkdir -p ~/.local/esbmc
          cp -r release/* ~/.local/esbmc/
          chmod +x ~/.local/esbmc/bin/esbmc

      - name: Prove the bounds arithmetic
        env:
          ESBMC: /home/runner/.local/esbmc/bin/esbmc
          TIMEOUT: 600
        run: |
          "$ESBMC" --version
          ./scripts/verify_esbmc.sh

  # The second leg used to be `SOLVER: --boolector` against the same suite,
  # described as "two independent solvers". It was not: scripts/verify_esbmc.sh
  # lets each harness pin its own backend with `// ESBMC-SOLVER:` and that pin
  # overrides SOLVER, and ten of the fourteen default harnesses are pinned -- so
  # for 253 of the 286 proofs both legs invoked byte-identical esbmc commands,
  # and one harness pins --cvc5, which neither leg ever ran.
  #
  # `--cross` is the mode that actually does what the matrix was describing: it
  # runs every proof under z3 AND boolector, asks the pinned backend directly
  # when the pin is outside that pair, and fails on disagreement -- including
  # the case where both agree a property does NOT hold, which is a refutation
  # rather than an agreement. It existed and no workflow called it.
  #
  # It is not on the push path because it is hours rather than minutes: three
  # backend runs per proof against the main run's one.
  cross:
    name: cross-check both backends
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - name: Cache the ESBMC release build
        id: esbmc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/esbmc
          key: esbmc-${{ env.ESBMC_TAG }}

      - name: Install ESBMC
        if: steps.esbmc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o esbmc-linux.zip \
            "https://github.com/esbmc/esbmc/releases/download/${ESBMC_TAG}/esbmc-linux.zip"
          unzip -q esbmc-linux.zip
          mkdir -p ~/.local/esbmc
          cp -r release/* ~/.local/esbmc/
          chmod +x ~/.local/esbmc/bin/esbmc

      - name: Every proof under two backends
        env:
          ESBMC: /home/runner/.local/esbmc/bin/esbmc
          TIMEOUT: 900
        run: ./scripts/verify_esbmc.sh --cross
