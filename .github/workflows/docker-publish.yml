name: docker-publish

# REL-02 — source rebuild of the in-tree Dockerfile (360 min, LLVM from source).
# Dispatch only. Tag releases pack GHCR via docker-from-release.yml so this
# job cannot overwrite the tarball image with a different layout.
# Docker Hub imortek/retdec is still unpublished (no Hub credentials here).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/retdec"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="dispatch-${GITHUB_RUN_ID}"
          fi
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "pushed ${IMAGE}:${TAG} and ${IMAGE}:latest"
