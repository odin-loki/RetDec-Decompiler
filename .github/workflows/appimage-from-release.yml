name: appimage-from-release

# REL-03 leftover: wrap the published Linux tarball as an AppImage without
# rebuilding LLVM. Skip if the Release already has the AppImage.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose Linux tarball is wrapped
        required: false
        default: v2.0.21
  push:
    branches: [main]
    paths:
      - ".github/workflows/appimage-from-release.yml"
      - "scripts/make-appimage.sh"

permissions:
  contents: write
  id-token: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Wrap published Linux tarball as AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v2.0.21' }}
        run: |
          set -euo pipefail
          NAME="retdec-${TAG#v}-x86_64.AppImage"
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx "${NAME}"; then
            echo "already published: ${NAME}"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file \
            qt6-base-dev \
            libqt6svg6 \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            imagemagick
          mkdir -p /tmp/rel
          gh release download "${TAG}" --pattern 'retdec-*-linux-x64.tar.gz' --dir /tmp/rel
          tb="$(find /tmp/rel -name 'retdec-*-linux-x64.tar.gz' | head -n1)"
          test -n "${tb}" || { echo "no Linux tarball on ${TAG}"; exit 1; }
          tar xzf "${tb}" -C /tmp/rel
          stage="$(find /tmp/rel -maxdepth 1 -type d -name 'retdec-*-linux-x64' | head -n1)"
          test -n "${stage}"
          test -x "${stage}/bin/retdec-decompiler"
          if [[ -x "${stage}/bin/retdec-gui" ]]; then
            echo "tarball includes retdec-gui"
          else
            echo "tarball has no retdec-gui; wrapping CLI only"
          fi
          out="/tmp/rel/${NAME}"
          bash scripts/make-appimage.sh \
            --install-dir "${stage}" \
            --out "${out}" \
            --version "${TAG#v}"
          test -f "${out}"
          cosign sign-blob --yes --bundle "${out}.sigstore.json" "${out}"
          gh release upload "${TAG}" "${out}" "${out}.sigstore.json"
          echo "uploaded ${NAME} to ${TAG}"
