# Nothing in this repository had ever compiled the tree on macOS.
#
# `macos-latest` appeared in exactly one workflow -- doc-integrity, running
# three Python documentation checks -- while README.md and
# docs/BUILD_REFERENCE.md advertised the `full-linux-*` presets as
# "Linux/WSL/macOS" and CMakeLists.txt carried if(APPLE) RPATH and ranlib
# handling. A platform claim with no artefact behind it is the thing
# docs/CLAIMS.md exists to catch, and this is the artefact.
#
# The steps are split finer than ctest-linux's on purpose. The first run of a
# build that has never happened wants the log to say WHICH stage failed
# without reading it: the dependency builds, the decompiler, the test tree and
# a real decompile are separate steps.
name: ctest-macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RETDEC_GUI_HEADLESS: "1"
  # cocoa, not offscreen: macdeployqt puts libqcocoa.dylib in the bundle and
  # MAC-01 then stops the app searching Homebrew. offscreen is not in the
  # bundle; gui_headless_decompile_fib aborted with "Available platform
  # plugins are: cocoa."
  QT_QPA_PLATFORM: cocoa

# A push on top of a push leaves the older run building for another
# forty minutes on a result nobody will read. standalone-check has had
# this since it was written; these two did not, and two macOS runs
# building LLVM side by side is how that was noticed.
concurrency:
  group: ctest-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: ctest-macos
          max-size: 8G

      # autoconf/automake/libtool are for YARA, which bootstraps with autotools:
      # its configure step runs ./bootstrap.sh, and the first run of this job
      # died on `autoreconf: command not found`. macOS runners ship neither.
      #
      # Qt is Homebrew's, and that was tried the other way round first. The
      # official Qt 6.7.3 macOS archive -- the one ctest-windows uses, through
      # jurplel/install-qt-action -- puts `-framework AGL` on the link line of
      # anything that links Qt6::Gui, and Apple removed AGL from the macOS SDK:
      #
      #     ld: framework 'AGL' not found
      #
      # It is a clean configure and a dead link, so that route is closed until
      # the pinned Qt version moves. Homebrew's Qt builds. What it costs is
      # relocatability -- its frameworks carry absolute install names into
      # /opt/homebrew -- and that is what MAC-01 exists to repair and verify,
      # below.
      - name: Install dependencies
        run: |
          brew update
          brew install ninja qt@6 pkg-config autoconf automake libtool
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      # Not the Homebrew interpreter CMake would otherwise pick. Two reasons,
      # both measured:
      #
      #   * decompiler_corpus_regression failed its first macOS run with
      #     "PyYAML required for YAML manifests" -- the manifest is YAML and
      #     the runner had no parser. ctest-linux installs python3-yaml and
      #     ctest-windows pip-installs pyyaml; this job installed neither.
      #     Homebrew's python is PEP-668 externally-managed, so `pip install`
      #     into it is refused; a tool-cache interpreter takes the package.
      #
      #   * CMake had selected Homebrew's python 3.14. ctest-windows pins 3.12
      #     because the pyc opcode tables cover 3.8-3.12, and hello.pyc is a
      #     fixture here too. Same pin, same reason.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Python packages the tests parse their manifests with
        run: python3 -m pip install --quiet pyyaml

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        with:
          cmakeVersion: "3.31.6"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      # restore/save rather than the combined action, because the combined one
      # saves only when the job succeeds. The dependency build here is LLVM 23
      # from source -- 35 minutes on the first run -- and every red round would
      # otherwise pay it again.
      - name: Restore the CMake build
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/linux
          key: ctest-macos-qt4-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/**/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            ctest-macos-qt4-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/**/CMakeLists.txt') }}-
            ctest-macos-qt4-

      # full-linux-release is the preset the documentation tells a macOS reader
      # to use, so it is the one measured. Interprocedural optimisation is off
      # here and only here: the preset turns it on, and an LTO link of this
      # tree on a runner is minutes per binary for no signal this job wants.
      - name: Configure (full-linux-release, CPU-only)
        run: >
          cmake --preset full-linux-release
          -DPython3_EXECUTABLE=${{ env.pythonLocation }}/bin/python3
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_ENABLE_NEURAL=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the dependencies
        run: cmake --build build/linux --parallel --target llvm-project

      - name: Build the decompiler
        run: cmake --build build/linux --parallel --target retdec-decompiler

      # What this asserts is that the binary this job built links and runs.
      # It does NOT assert that a native arm64 Mach-O decompiles: the first
      # macOS build to get this far ran the phases and emitted nothing for one,
      # which is an open question recorded in the audit rather than a property
      # of the build. The attempt still runs, and its outcome is printed on
      # every run so the answer is in the log rather than in somebody's memory.
      # The functional measure for this job is the unit tests below.
      - name: The decompiler runs
        run: |
          set -euo pipefail
          DEC="$(find build/linux -name retdec-decompiler -type f -perm -u+x | head -n1)"
          test -n "${DEC}" || { echo "no retdec-decompiler was built"; exit 1; }
          echo "built: ${DEC}"
          "${DEC}" --version

      - name: Try a native arm64 Mach-O, and say what happened
        continue-on-error: true
        run: |
          set -uo pipefail
          DEC="$(find build/linux -name retdec-decompiler -type f -perm -u+x | head -n1)"
          printf 'int main(void){return 41+1;}\n' > /tmp/smoke.c
          cc -o /tmp/smoke /tmp/smoke.c
          file /tmp/smoke
          "${DEC}" /tmp/smoke -o /tmp/smoke.c.out
          echo "exit ${?}"
          if [ -s /tmp/smoke.c.out ]; then
            echo "--- emitted C ---"
            head -n 40 /tmp/smoke.c.out
          else
            echo "OPEN: a native arm64 Mach-O produced no output; see Batch BP"
          fi

      - name: Build the tests
        run: cmake --build build/linux --parallel

      # The bundle the macOS installer job ships. macdeployqt leaves some of
      # its libraries pointing into this machine's Homebrew prefix -- libwebp,
      # libsharpyuv and libbrotlicommon, which Qt's image-format plugins pull
      # in -- and then reports "code object is not signed at all". An app whose
      # libraries live on the build machine opens nowhere else, so this is a
      # step and not a note. --fix brings them in and re-signs; the check then
      # looks again and fails if anything still points out of the bundle or the
      # signature does not verify.
      - name: MAC-01 the GUI bundle resolves inside itself and verifies
        run: |
          python3 scripts/ci/check_macos_bundle.py --self-test
          APP="$(find build/linux -maxdepth 4 -name 'retdec-gui.app' -type d | head -n1)"
          test -n "$APP" || { echo "no retdec-gui.app was built"; exit 1; }
          python3 scripts/ci/check_macos_bundle.py --fix "$APP"

      # Not `-L unit`. That label selects six tests. The tree registers 46 with
      # ctest and 31 of them carry no label at all, so the label filter
      # ctest-linux and ctest-windows both use has been skipping thirty gtest
      # suites -- 2,158 test cases -- that CI compiles and links on every run
      # and then never executes. This job is the one that builds the whole
      # tree, so it runs the whole registered set with no filter: nothing can
      # fall through a selector that is not there. TESTSEL-01 keeps it that
      # way.
      #
      # --timeout bounds a single hanging test to ten minutes rather than
      # ctest's 1500-second default times however many tests are left.
      - name: Every registered test
        run: ctest --test-dir build/linux --output-on-failure --timeout 600

      - name: Save the CMake build
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/linux
          key: ctest-macos-qt4-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/**/CMakeLists.txt') }}-${{ github.run_id }}

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          path: |
            build/linux/CMakeFiles/CMakeConfigureLog.yaml
            build/linux/external/**/*.log
          if-no-files-found: ignore
