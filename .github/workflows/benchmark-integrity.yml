name: benchmark-integrity

# B6 — filename-rename guard. Skip-safe when the decompiler or corpus is
# missing (configure-only trees). The same script runs after the decompiler
# build in ctest-linux.yml (PR / main, 5 binaries) and
# algorithm-recovery-nightly.yml (more binaries).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rename-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filename-rename CI guard
        env:
          RENAME_GUARD_LIMIT: "5"
        run: bash scripts/ci/benchmark_rename_guard.sh --limit 5
