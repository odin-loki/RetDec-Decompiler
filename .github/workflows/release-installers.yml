name: release-installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (tag push uses git tag; manual only)"
        required: false
        default: ""
      skip_build:
        description: "Publish existing dist/ artifacts only (no rebuild)"
        type: boolean
        default: false
      appimage:
        description: "Also build Linux AppImage (or set job env APPIMAGE=1)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
            TAG="v${VER}"
          else
            VER="$(grep -E '^[[:space:]]*VERSION[[:space:]]' CMakeLists.txt | head -1 | sed -E 's/.*VERSION[[:space:]]+([0-9.]+).*/\1/')"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release: ${TAG} (${VER})"

      - name: Verify licence files installed in tree
        run: |
          test -f LICENSE && test -f LICENSE-AGPL && test -f LICENSE-COMMERCIAL && test -f NOTICE

      - name: Assert commercial package excludes capstone2llvmirtool
        run: |
          if grep -rq 'capstone2llvmirtool' packaging/ 2>/dev/null; then
            echo "capstone2llvmirtool must not ship in commercial manifests"
            exit 1
          fi
          echo "Commercial GPL exclusion check passed"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Regenerate benchmark tables
        run: bash scripts/regenerate_benchmark_tables.sh

      - name: Ship checklist
        run: bash scripts/ship_checklist.sh

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: RetDec Imortek ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Detect prebuilt Windows artifacts
        id: prebuilt
        shell: pwsh
        run: |
          $ver = "${{ needs.release.outputs.version }}"
          $setup = "dist/retdec-$ver-windows-x64-setup.exe"
          $zip = "dist/retdec-$ver-windows-x64-portable.zip"
          if ((Test-Path $setup) -and (Test-Path $zip)) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has=true"
            Write-Host "Found prebuilt Windows installers in dist/ — skipping rebuild"
          }

      - name: Verify prebuilt Windows installers
        if: steps.prebuilt.outputs.has == 'true' || (github.event_name == 'workflow_dispatch' && inputs.skip_build)
        shell: pwsh
        run: |
          $ver = "${{ needs.release.outputs.version }}"
          foreach ($f in @(
            "dist/retdec-$ver-windows-x64-setup.exe",
            "dist/retdec-$ver-windows-x64-portable.zip"
          )) {
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }

      - name: Fetch large support files
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/avast/retdec/master"

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        with:
          arch: x64

      - name: Install Perl and NSIS
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: choco install strawberryperl nsis -y --no-progress

      - name: Install Qt 6 (MSVC x64)
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          archives: qtbase qtsvg

      - uses: lukka/get-cmake@latest
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        with:
          cmakeVersion: "3.31.6"

      - name: Restore Windows dep cache
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        id: win_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows/deps
            build/windows/external
            build/windows/llvm-project-prefix
          key: installer-win-deps-${{ hashFiles('cmake/deps.cmake') }}-${{ github.run_id }}
          restore-keys: |
            installer-win-deps-${{ hashFiles('cmake/deps.cmake') }}-
            installer-win-deps-

      - name: Install EnVar NSIS plugin
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "${env:ProgramFiles}\NSIS"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw "NSIS install directory not found" }
          $pluginDir = Join-Path $nsis "Plugins\x86-unicode"
          $includeDir = Join-Path $nsis "Include"
          New-Item -ItemType Directory -Force -Path $pluginDir, $includeDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/GsNSIS/EnVar/releases/download/v0.3.1/EnVar-Plugin.zip" -OutFile envar.zip
          Expand-Archive envar.zip -DestinationPath envar -Force
          $dll = Get-ChildItem -Path envar -Recurse -Filter EnVar.dll | Select-Object -First 1
          $nsh = Get-ChildItem -Path envar -Recurse -Filter EnVar.nsh | Select-Object -First 1
          if (-not $dll) { throw "EnVar.dll missing from EnVar-Plugin.zip" }
          Copy-Item $dll.FullName (Join-Path $pluginDir "EnVar.dll") -Force
          if ($nsh) { Copy-Item $nsh.FullName (Join-Path $includeDir "EnVar.nsh") -Force }
          Write-Host "Installed EnVar from $($dll.FullName) into $pluginDir"

      - name: Configure (full-windows-release, CPU-only CI)
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          cmake --preset full-windows-release `
            -DRETDEC_ENABLE_CUDA_ACCEL=OFF `
            -DRETDEC_TESTS=OFF `
            -DRETDEC_ENABLE_NEURAL=OFF `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF `
            -DRETDEC_ENABLE_RETDEC_DECOMPILER=ON `
            -DRETDEC_ENABLE_FILEINFO=ON

      - name: Build and package Windows installers
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        id: win_pkg
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "1"
          cmake --build build/windows --parallel 1 --target llvm-project
          if ($LASTEXITCODE -ne 0) { throw "llvm-project build failed" }
          if (Test-Path "build/windows/deps/install/llvm/lib/LLVMPasses.lib") {
            Get-ChildItem -Path "build/windows/llvm-project-prefix" -Recurse -Filter *.obj -ErrorAction SilentlyContinue | Remove-Item -Force
          }
          .\scripts\build-windows-installer.ps1 -Version "${{ needs.release.outputs.version }}"

      - name: Annotate Windows build failure
        if: failure() && steps.win_pkg.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-windows.log")
          if not p.exists():
              print("::error::Windows installer failed and build-windows.log is missing")
              raise SystemExit(0)
          raw = p.read_text(errors="replace").splitlines()
          keys = (
              "FAILED", "error C", "error LNK", "fatal error", "error:",
              "No space", "ninja: build stopped", "MSB", ": error ",
          )
          hits = [ln for ln in raw if any(k in ln for k in keys)]
          lines = (hits[-30:] + raw[-20:]) if hits else raw[-80:]
          text = "%0A".join(x.replace("%", "%25").replace("::", " :") for x in lines)
          print(f"::error::Windows installer build failed%0A{text}")
          PY

      - name: Upload Windows build log
        if: failure() && steps.win_pkg.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-build-log
          path: build-windows.log
          if-no-files-found: ignore

      - name: Save Windows dep cache
        if: always() && steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: actions/cache/save@v4
        with:
          path: |
            build/windows/deps
            build/windows/external
            build/windows/llvm-project-prefix
          key: installer-win-deps-${{ hashFiles('cmake/deps.cmake') }}-${{ github.run_id }}

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/retdec-${{ needs.release.outputs.version }}-windows-x64-setup.exe
            dist/retdec-${{ needs.release.outputs.version }}-windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-installer:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APPIMAGE: ${{ (github.event_name == 'workflow_dispatch' && inputs.appimage == true) && '1' || vars.APPIMAGE || '0' }}
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Detect prebuilt Linux tarball
        id: prebuilt
        run: |
          ver="${{ needs.release.outputs.version }}"
          tb="dist/retdec-${ver}-linux-x64.tar.gz"
          if [ -f "$tb" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "Found prebuilt Linux tarball in dist/ — skipping rebuild"
          fi

      - name: Verify prebuilt Linux tarball
        if: steps.prebuilt.outputs.has == 'true' || (github.event_name == 'workflow_dispatch' && inputs.skip_build)
        run: |
          ver="${{ needs.release.outputs.version }}"
          tb="dist/retdec-${ver}-linux-x64.tar.gz"
          test -f "$tb" || { echo "Missing $tb"; exit 1; }

      - name: Install dependencies
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3 \
            python3-yaml \
            perl \
            flex \
            bison \
            libssl-dev \
            zlib1g-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - uses: lukka/get-cmake@latest
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        with:
          cmakeVersion: "3.31.6"

      - name: ccache
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Restore Linux dep cache
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux/deps
            build/linux/external
            build/linux/llvm-project-prefix
          key: installer-linux-deps-${{ hashFiles('cmake/deps.cmake') }}-${{ github.run_id }}
          restore-keys: |
            installer-linux-deps-${{ hashFiles('cmake/deps.cmake') }}-
            installer-linux-deps-

      - name: Fetch large support files
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Configure (full-linux-release, CPU-only CI)
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: >
          cmake --preset full-linux-release
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_TESTS=OFF
          -DRETDEC_ENABLE_NEURAL=OFF
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DRETDEC_ENABLE_RETDEC_DECOMPILER=ON
          -DRETDEC_ENABLE_FILEINFO=ON

      - name: Build and package Linux tarball
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        id: linux_pkg
        env:
          APPIMAGE: ${{ env.APPIMAGE }}
        run: |
          set -euo pipefail
          {
            df -h
            cmake --build build/linux --parallel 1 --target llvm-project
            if [ -f build/linux/deps/install/llvm/lib/libLLVMPasses.a ]; then
              find build/linux/llvm-project-prefix -name '*.o' -delete || true
            fi
            df -h
            cmake --build build/linux --parallel 2 --target install
            bash scripts/build-linux-installer.sh --skip-install --version "${{ needs.release.outputs.version }}"
          } 2>&1 | tee build-linux.log

      - name: Annotate Linux build failure
        if: failure() && steps.linux_pkg.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-linux.log")
          if not p.exists():
              print("::error::Linux installer failed and build-linux.log is missing")
              raise SystemExit(0)
          raw = p.read_text(errors="replace").splitlines()
          keys = ("FAILED", "error:", "CMake Error", "cannot find", "fatal", "No space", "ninja: build stopped")
          hits = [ln for ln in raw if any(k in ln for k in keys)]
          lines = (hits[-20:] + raw[-30:]) if hits else raw[-50:]
          text = "%0A".join(x.replace("%", "%25") for x in lines)
          print(f"::error::Linux installer build failed%0A{text}")
          PY

      - name: Upload Linux build log
        if: failure() && steps.linux_pkg.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer-build-log
          path: build-linux.log
          if-no-files-found: ignore

      - name: Save Linux dep cache
        if: always() && steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux/deps
            build/linux/external
            build/linux/llvm-project-prefix
          key: installer-linux-deps-${{ hashFiles('cmake/deps.cmake') }}-${{ github.run_id }}

      - name: Verify optional AppImage
        if: env.APPIMAGE == '1'
        run: |
          ver="${{ needs.release.outputs.version }}"
          appimage="dist/retdec-${ver}-x86_64.AppImage"
          test -f "$appimage" || { echo "Missing $appimage"; exit 1; }

      - name: Verify Linux release artifacts
        run: |
          ver="${{ needs.release.outputs.version }}"
          tb="dist/retdec-${ver}-linux-x64.tar.gz"
          test -f "$tb" || { echo "Missing $tb"; exit 1; }
          test -f releases/linux/install.sh || { echo "Missing releases/linux/install.sh"; exit 1; }
          test -f releases/linux/uninstall.sh || { echo "Missing releases/linux/uninstall.sh"; exit 1; }

      - name: Upload Linux release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/retdec-${{ needs.release.outputs.version }}-linux-x64.tar.gz
            releases/linux/install.sh
            releases/linux/uninstall.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux AppImage (optional)
        if: env.APPIMAGE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/retdec-${{ needs.release.outputs.version }}-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
