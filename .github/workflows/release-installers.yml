name: release-installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (tag push uses git tag; manual only)"
        required: false
        default: ""
      skip_build:
        description: "Publish existing dist/ artifacts only (no rebuild)"
        type: boolean
        default: false
      appimage:
        description: "Also build Linux AppImage (or set job env APPIMAGE=1)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
            TAG="v${VER}"
          else
            VER="$(grep -E '^[[:space:]]*VERSION[[:space:]]' CMakeLists.txt | head -1 | sed -E 's/.*VERSION[[:space:]]+([0-9.]+).*/\1/')"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release: ${TAG} (${VER})"

      - name: Verify licence files installed in tree
        run: |
          test -f LICENSE && test -f LICENSE-AGPL && test -f LICENSE-COMMERCIAL && test -f NOTICE

      - name: Assert commercial package excludes capstone2llvmirtool
        run: |
          if grep -rq 'capstone2llvmirtool' packaging/ 2>/dev/null; then
            echo "capstone2llvmirtool must not ship in commercial manifests"
            exit 1
          fi
          echo "Commercial GPL exclusion check passed"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Regenerate benchmark tables
        run: bash scripts/regenerate_benchmark_tables.sh

      - name: Ship checklist
        run: bash scripts/ship_checklist.sh

      - name: Generate CycloneDX SBOM from CMake pins
        run: python scripts/ci/generate_cyclonedx.py --out retdec-${{ steps.meta.outputs.version }}.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign CycloneDX SBOM
        run: |
          cosign sign-blob --yes \
            --bundle "retdec-${{ steps.meta.outputs.version }}.cdx.json.sigstore.json" \
            "retdec-${{ steps.meta.outputs.version }}.cdx.json"

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: RetDec Imortek ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            retdec-${{ steps.meta.outputs.version }}.cdx.json
            retdec-${{ steps.meta.outputs.version }}.cdx.json.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect prebuilt Windows artifacts
        id: prebuilt
        shell: pwsh
        run: |
          $ver = "${{ needs.release.outputs.version }}"
          $setup = "dist/retdec-$ver-windows-x64-setup.exe"
          $zip = "dist/retdec-$ver-windows-x64-portable.zip"
          if ((Test-Path $setup) -and (Test-Path $zip)) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has=true"
            Write-Host "Found prebuilt Windows installers in dist/ — skipping rebuild"
          }

      - name: Verify prebuilt Windows installers
        if: steps.prebuilt.outputs.has == 'true' || (github.event_name == 'workflow_dispatch' && inputs.skip_build)
        shell: pwsh
        run: |
          $ver = "${{ needs.release.outputs.version }}"
          foreach ($f in @(
            "dist/retdec-$ver-windows-x64-setup.exe",
            "dist/retdec-$ver-windows-x64-portable.zip"
          )) {
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }

      - name: Fetch large support files
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/avast/retdec/master"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        with:
          arch: x64

      - name: Install Perl and NSIS
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: choco install strawberryperl nsis -y --no-progress

      - name: Install Qt 6 (MSVC x64)
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          archives: qtbase qtsvg

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        with:
          cmakeVersion: "3.31.6"

      - name: Restore Windows dep cache
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        id: win_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/windows/deps
            build/windows/external
            build/windows/llvm-project-prefix
          key: installer-win-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            installer-win-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-
            installer-win-deps-

      - name: Install EnVar NSIS plugin
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "${env:ProgramFiles}\NSIS"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw "NSIS install directory not found" }
          $pluginDir = Join-Path $nsis "Plugins\x86-unicode"
          $includeDir = Join-Path $nsis "Include"
          New-Item -ItemType Directory -Force -Path $pluginDir, $includeDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/GsNSIS/EnVar/releases/download/v0.3.1/EnVar-Plugin.zip" -OutFile envar.zip
          Expand-Archive envar.zip -DestinationPath envar -Force
          # NSIS 3 Unicode is 32-bit; amd64-unicode EnVar.dll will not load.
          $dll = Get-ChildItem -Path envar -Recurse -Filter EnVar.dll |
            Where-Object { $_.FullName -match '[\\/]x86-unicode[\\/]' } |
            Select-Object -First 1
          if (-not $dll) { throw "EnVar.dll (x86-unicode) missing from EnVar-Plugin.zip" }
          $nsh = Get-ChildItem -Path envar -Recurse -Filter EnVar.nsh | Select-Object -First 1
          Copy-Item $dll.FullName (Join-Path $pluginDir "EnVar.dll") -Force
          if ($nsh) { Copy-Item $nsh.FullName (Join-Path $includeDir "EnVar.nsh") -Force }
          Write-Host "Installed EnVar from $($dll.FullName) into $pluginDir"

      - name: Configure (full-windows-release, CPU-only CI)
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          cmake --preset full-windows-release `
            -DRETDEC_ENABLE_CUDA_ACCEL=OFF `
            -DRETDEC_TESTS=OFF `
            -DRETDEC_ENABLE_NEURAL=OFF `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF `
            -DRETDEC_ENABLE_RETDEC_DECOMPILER=ON `
            -DRETDEC_ENABLE_FILEINFO=ON

      - name: Build and package Windows installers
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        id: win_pkg
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "1"
          cmake --build build/windows --parallel 1 --target llvm-project
          if ($LASTEXITCODE -ne 0) { throw "llvm-project build failed" }
          if (Test-Path "build/windows/deps/install/llvm/lib/LLVMPasses.lib") {
            Get-ChildItem -Path "build/windows/llvm-project-prefix" -Recurse -Filter *.obj -ErrorAction SilentlyContinue | Remove-Item -Force
          }
          .\scripts\build-windows-installer.ps1 -Version "${{ needs.release.outputs.version }}"

      - name: Annotate Windows build failure
        if: failure() && steps.win_pkg.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-windows.log")
          if not p.exists():
              print("::error::Windows installer failed and build-windows.log is missing")
              raise SystemExit(0)
          raw = p.read_text(errors="replace").splitlines()
          keys = (
              "FAILED", "error C", "error LNK", "fatal error", "error:",
              "No space", "ninja: build stopped", "MSB", ": error ",
              "Plugin not found", "Error in script", "makensis failed",
          )
          hits = [ln for ln in raw if any(k in ln for k in keys)]
          lines = (hits[-30:] + raw[-20:]) if hits else raw[-80:]
          text = "%0A".join(x.replace("%", "%25").replace("::", " :") for x in lines)
          print(f"::error::Windows installer build failed%0A{text}")
          PY

      - name: Upload Windows build log
        if: failure() && steps.win_pkg.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-build-log
          path: build-windows.log
          if-no-files-found: ignore

      - name: Save Windows dep cache
        if: always() && steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/windows/deps
            build/windows/external
            build/windows/llvm-project-prefix
          key: installer-win-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-${{ github.run_id }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Windows artefacts
        shell: pwsh
        run: |
          $ver = "${{ needs.release.outputs.version }}"
          cosign sign-blob --yes --bundle "dist/retdec-$ver-windows-x64-setup.exe.sigstore.json" "dist/retdec-$ver-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "cosign setup.exe failed" }
          cosign sign-blob --yes --bundle "dist/retdec-$ver-windows-x64-portable.zip.sigstore.json" "dist/retdec-$ver-windows-x64-portable.zip"
          if ($LASTEXITCODE -ne 0) { throw "cosign zip failed" }

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/retdec-${{ needs.release.outputs.version }}-windows-x64-setup.exe
            dist/retdec-${{ needs.release.outputs.version }}-windows-x64-setup.exe.sigstore.json
            dist/retdec-${{ needs.release.outputs.version }}-windows-x64-portable.zip
            dist/retdec-${{ needs.release.outputs.version }}-windows-x64-portable.zip.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-installer:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APPIMAGE: ${{ (github.event_name == 'workflow_dispatch' && inputs.appimage == true) && '1' || vars.APPIMAGE || '0' }}
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect prebuilt Linux tarball
        id: prebuilt
        run: |
          ver="${{ needs.release.outputs.version }}"
          tb="dist/retdec-${ver}-linux-x64.tar.gz"
          if [ -f "$tb" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "Found prebuilt Linux tarball in dist/ — skipping rebuild"
          fi

      - name: Verify prebuilt Linux tarball
        if: steps.prebuilt.outputs.has == 'true' || (github.event_name == 'workflow_dispatch' && inputs.skip_build)
        run: |
          ver="${{ needs.release.outputs.version }}"
          tb="dist/retdec-${ver}-linux-x64.tar.gz"
          test -f "$tb" || { echo "Missing $tb"; exit 1; }

      - name: Install dependencies
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3 \
            python3-yaml \
            perl \
            flex \
            bison \
            libssl-dev \
            zlib1g-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        with:
          cmakeVersion: "3.31.6"

      - name: ccache
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2

      - name: Restore Linux dep cache
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/linux/deps
            build/linux/external
            build/linux/llvm-project-prefix
          key: installer-linux-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            installer-linux-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-
            installer-linux-deps-

      - name: Fetch large support files
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Configure (full-linux-release, CPU-only CI)
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: >
          cmake --preset full-linux-release
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_TESTS=OFF
          -DRETDEC_ENABLE_NEURAL=OFF
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DRETDEC_ENABLE_RETDEC_DECOMPILER=ON
          -DRETDEC_ENABLE_FILEINFO=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build and package Linux tarball
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        id: linux_pkg
        env:
          APPIMAGE: ${{ env.APPIMAGE }}
        run: |
          set -euo pipefail
          {
            df -h
            cmake --build build/linux --parallel 1 --target llvm-project
            if [ -f build/linux/deps/install/llvm/lib/libLLVMPasses.a ]; then
              find build/linux/llvm-project-prefix -name '*.o' -delete || true
            fi
            df -h
            cmake --build build/linux --parallel 2 --target install
            bash scripts/build-linux-installer.sh --skip-install --version "${{ needs.release.outputs.version }}"
          } 2>&1 | tee build-linux.log

      - name: Annotate Linux build failure
        if: failure() && steps.linux_pkg.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-linux.log")
          if not p.exists():
              print("::error::Linux installer failed and build-linux.log is missing")
              raise SystemExit(0)
          raw = p.read_text(errors="replace").splitlines()
          keys = ("FAILED", "error:", "CMake Error", "cannot find", "fatal", "No space", "ninja: build stopped")
          hits = [ln for ln in raw if any(k in ln for k in keys)]
          lines = (hits[-20:] + raw[-30:]) if hits else raw[-50:]
          text = "%0A".join(x.replace("%", "%25") for x in lines)
          print(f"::error::Linux installer build failed%0A{text}")
          PY

      - name: Upload Linux build log
        if: failure() && steps.linux_pkg.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-installer-build-log
          path: build-linux.log
          if-no-files-found: ignore

      - name: Save Linux dep cache
        if: always() && steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/linux/deps
            build/linux/external
            build/linux/llvm-project-prefix
          key: installer-linux-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-${{ github.run_id }}

      - name: Verify optional AppImage
        if: env.APPIMAGE == '1'
        run: |
          ver="${{ needs.release.outputs.version }}"
          appimage="dist/retdec-${ver}-x86_64.AppImage"
          test -f "$appimage" || { echo "Missing $appimage"; exit 1; }

      - name: Verify Linux release artifacts
        run: |
          ver="${{ needs.release.outputs.version }}"
          tb="dist/retdec-${ver}-linux-x64.tar.gz"
          test -f "$tb" || { echo "Missing $tb"; exit 1; }
          test -f releases/linux/install.sh || { echo "Missing releases/linux/install.sh"; exit 1; }
          test -f releases/linux/uninstall.sh || { echo "Missing releases/linux/uninstall.sh"; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Linux tarball
        run: |
          ver="${{ needs.release.outputs.version }}"
          cosign sign-blob --yes \
            --bundle "dist/retdec-${ver}-linux-x64.tar.gz.sigstore.json" \
            "dist/retdec-${ver}-linux-x64.tar.gz"

      - name: Upload Linux release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/retdec-${{ needs.release.outputs.version }}-linux-x64.tar.gz
            dist/retdec-${{ needs.release.outputs.version }}-linux-x64.tar.gz.sigstore.json
            releases/linux/install.sh
            releases/linux/uninstall.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux AppImage (optional)
        if: env.APPIMAGE == '1'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/retdec-${{ needs.release.outputs.version }}-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS had no release job at all until now: release-installers built Windows
  # and Linux, README and docs/BUILD_REFERENCE.md advertised the full-linux-*
  # presets as "Linux/WSL/macOS", and nothing in this repository had ever
  # compiled the tree on a Mac. ctest-macos is the build; this is the package.
  #
  # It mirrors linux-installer step for step, with the three things that are
  # different about macOS handled in scripts/build-macos-installer.sh and
  # scripts/ci/check_macos_bundle.py rather than here: the GUI is an .app
  # bundle, its Qt libraries need bringing in off the build machine, and
  # Gatekeeper quarantines anything a browser downloaded.
  macos-installer:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect prebuilt macOS tarball
        id: prebuilt
        run: |
          ver="${{ needs.release.outputs.version }}"
          arch="$(uname -m)"
          tb="dist/retdec-${ver}-macos-${arch}.tar.gz"
          if [ -f "$tb" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "Found prebuilt macOS tarball in dist/ — skipping rebuild"
          fi
          echo "arch=${arch}" >> "$GITHUB_OUTPUT"

      - name: Verify prebuilt macOS tarball
        if: steps.prebuilt.outputs.has == 'true' || (github.event_name == 'workflow_dispatch' && inputs.skip_build)
        run: |
          ver="${{ needs.release.outputs.version }}"
          tb="dist/retdec-${ver}-macos-${{ steps.prebuilt.outputs.arch }}.tar.gz"
          test -f "$tb" || { echo "Missing $tb"; exit 1; }

      # autoconf/automake/libtool are for YARA, which bootstraps with autotools
      # and is not on a macOS runner by default.
      # Homebrew's Qt, for the reason spelled out in ctest-macos.yml: the
      # official 6.7.3 macOS archive links `-framework AGL`, which Apple has
      # removed from the SDK. MAC-01 is what makes the resulting bundle
      # relocatable, and it runs twice below -- on the staged copy and on the
      # copy extracted back out of the tarball.
      - name: Install dependencies
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: |
          brew update --quiet || true
          # No `|| true` on the install. `brew --prefix qt@6` prints a path and
          # exits 0 whether or not the formula is there, so swallowing a failed
          # install sets CMAKE_PREFIX_PATH to a directory that does not exist
          # and the real error surfaces hundreds of lines later as a Qt6
          # find_package failure -- or as `autoreconf: command not found`
          # inside YARA, which is the error ctest-macos was written to stop.
          brew install ninja qt@6 pkg-config autoconf automake libtool
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      # `cmake --build --target install` is the only place in this repository
      # that runs support/install-share.py and support/install-yara.py on
      # macOS -- ctest-macos never invokes the install target. Without a pin
      # they run under Homebrew's python 3.14, and 3.14 changed the default
      # extraction filter for tarfile.extractall (PEP 706) from fully_trusted
      # to 'data', which refuses absolute member paths, members escaping the
      # destination, and links pointing outside it. install-share.py calls
      # extractall with no filter= and its caller is a FATAL_ERROR, so a
      # mismatch there is a hard failure at tag time. Same 3.12 as ctest-macos
      # and ctest-windows.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        with:
          python-version: "3.12"

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        with:
          cmakeVersion: "3.31.6"

      - name: ccache
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: installer-macos
          max-size: 8G

      - name: Restore macOS dep cache
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/linux/deps
            build/linux/external
            build/linux/llvm-project-prefix
          key: installer-macos-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            installer-macos-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-
            installer-macos-deps-

      - name: Fetch large support files
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      # The same option set linux-installer configures with. RETDEC_ENABLE_FILEINFO
      # is the one that matters: it is OFF by default, the release turns it ON,
      # and that is 101 translation units no ctest job compiled until PIN-01
      # started refusing a database configured without it.
      - name: Configure (full-linux-release, CPU-only)
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        run: >
          cmake --preset full-linux-release
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_TESTS=OFF
          -DRETDEC_ENABLE_NEURAL=OFF
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DRETDEC_ENABLE_RETDEC_DECOMPILER=ON
          -DRETDEC_ENABLE_FILEINFO=ON
          -DPython3_EXECUTABLE=${{ env.pythonLocation }}/bin/python3
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build and package macOS tarball
        if: steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        id: macos_pkg
        run: |
          set -euo pipefail
          {
            df -h
            cmake --build build/linux --parallel --target install
            bash scripts/build-macos-installer.sh \
              --skip-install \
              --install-dir install/linux \
              --version "${{ needs.release.outputs.version }}"
          } 2>&1 | tee build-macos.log

      - name: Annotate macOS build failure
        if: failure() && steps.macos_pkg.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-macos.log")
          if not p.exists():
              print("::error::macOS installer failed and build-macos.log is missing")
              raise SystemExit(0)
          raw = p.read_text(errors="replace").splitlines()
          keys = ("FAILED", "error:", "CMake Error", "cannot find", "fatal",
                  "No space", "ninja: build stopped", "MAC-01: FAIL")
          hits = [ln for ln in raw if any(k in ln for k in keys)]
          lines = (hits[-20:] + raw[-30:]) if hits else raw[-50:]
          text = "%0A".join(x.replace("%", "%25") for x in lines)
          print(f"::error::macOS installer build failed%0A{text}")
          PY

      - name: Upload macOS build log
        if: failure() && steps.macos_pkg.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-installer-build-log
          path: build-macos.log
          if-no-files-found: ignore

      - name: Save macOS dep cache
        if: always() && steps.prebuilt.outputs.has != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.skip_build)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/linux/deps
            build/linux/external
            build/linux/llvm-project-prefix
          key: installer-macos-deps-${{ hashFiles('cmake/deps.cmake', 'deps/**/CMakeLists.txt') }}-${{ github.run_id }}

      # What is in the tarball, rather than that a tarball exists. The CLI has
      # to run on this machine, the install scripts have to be there, and if a
      # GUI bundle was packaged its signature has to verify after the round
      # trip through tar -- which is where extended attributes get lost.
      - name: Verify macOS release artifacts
        run: |
          set -euo pipefail
          ver="${{ needs.release.outputs.version }}"
          arch="${{ steps.prebuilt.outputs.arch }}"
          tb="dist/retdec-${ver}-macos-${arch}.tar.gz"
          test -f "$tb" || { echo "Missing $tb"; exit 1; }
          work="$(mktemp -d)"
          tar xzf "$tb" -C "$work"
          root="${work}/retdec-${ver}-macos-${arch}"
          test -x "${root}/bin/retdec-decompiler" || { echo "Missing bin/retdec-decompiler"; exit 1; }
          test -x "${root}/install.sh" || { echo "Missing install.sh"; exit 1; }
          test -x "${root}/uninstall.sh" || { echo "Missing uninstall.sh"; exit 1; }
          "${root}/bin/retdec-decompiler" --version
          # The support tree, which nothing else here would notice was
          # missing: `--version` does not need it, and both packaging scripts
          # skip a missing directory in silence. It is installed by
          # support/CMakeLists.txt's install-time install-share.py, which has
          # never run on macOS before this job.
          test -s "${root}/share/retdec/BUILD-ID" \
            || { echo "Missing share/retdec -- the support tree did not install"; exit 1; }
          if [ -d "${root}/RetDec.app" ]; then
            python3 scripts/ci/check_macos_bundle.py "${root}/RetDec.app"
          else
            # Reachable only on the prebuilt / skip_build path now; the
            # packaging script refuses to build a GUI-less tarball itself.
            echo "the macOS package has no GUI bundle"
            exit 1
          fi
          test -f releases/macos/install.sh || { echo "Missing releases/macos/install.sh"; exit 1; }
          test -f releases/macos/uninstall.sh || { echo "Missing releases/macos/uninstall.sh"; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign macOS tarball
        run: |
          ver="${{ needs.release.outputs.version }}"
          arch="${{ steps.prebuilt.outputs.arch }}"
          cosign sign-blob --yes \
            --bundle "dist/retdec-${ver}-macos-${arch}.tar.gz.sigstore.json" \
            "dist/retdec-${ver}-macos-${arch}.tar.gz"

      # A release asset is named after the BASENAME of the path, not the path.
      # linux-installer uploads releases/linux/install.sh, which lands as
      # `install.sh` -- the published v2.0.21 release carries exactly that, and
      # `uninstall.sh` beside it. Both installer jobs only `needs: release`, so
      # they run in parallel and the second one to finish would overwrite the
      # first's script with a same-named, differently-behaving one. A macOS
      # user getting the Linux install.sh would install to the wrong prefix,
      # edit the wrong rc file, and never get the quarantine strip that is the
      # whole reason the macOS script exists.
      #
      # Renaming the Linux pair would break the v2.0.21 download URLs, so the
      # new side is the one that takes a distinct name.
      - name: Name the loose macOS scripts so they do not collide with Linux's
        run: |
          cp releases/macos/install.sh dist/install-macos.sh
          cp releases/macos/uninstall.sh dist/uninstall-macos.sh

      - name: Upload macOS release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/retdec-${{ needs.release.outputs.version }}-macos-${{ steps.prebuilt.outputs.arch }}.tar.gz
            dist/retdec-${{ needs.release.outputs.version }}-macos-${{ steps.prebuilt.outputs.arch }}.tar.gz.sigstore.json
            dist/install-macos.sh
            dist/uninstall-macos.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
