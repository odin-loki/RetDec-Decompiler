name: docker-from-release

# REL-02 — pack the published Linux tarball into GHCR without rebuilding LLVM.
# Docker Hub imortek/retdec stays unpublished (no Hub credentials here).
# Do not claim QUICKSTART docker pull works until a run of this job succeeds.
# Tag releases: wait for release-installers to finish so the tarball exists.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose Linux tarball is packed
        required: false
        default: v2.0.21
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-from-release.yml"
      - "Dockerfile.runtime"
  workflow_run:
    workflows: [release-installers]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack published Linux tarball and push GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag || '' }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_TAG}" ]]; then
            TAG="${DISPATCH_TAG}"
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            TAG="${RUN_BRANCH}"
            if [[ "${TAG}" != v* ]]; then
              echo "release-installers did not run on a v* tag (${TAG}); skip pack"
              exit 0
            fi
          else
            TAG="v2.0.21"
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/retdec"
          mkdir -p /tmp/docker-runtime
          cp Dockerfile.runtime /tmp/docker-runtime/Dockerfile
          gh release download "${TAG}" --pattern 'retdec-*-linux-x64.tar.gz' --dir /tmp/rel
          gh release download "${TAG}" --pattern 'fib_smoke' --dir /tmp/rel
          tb="$(find /tmp/rel -name 'retdec-*-linux-x64.tar.gz' | head -n1)"
          test -n "${tb}" || { echo "no Linux tarball on ${TAG}"; exit 1; }
          test -f /tmp/rel/fib_smoke || { echo "no fib_smoke on ${TAG}"; exit 1; }
          cp "${tb}" /tmp/docker-runtime/retdec-linux-x64.tar.gz
          cp /tmp/rel/fib_smoke /tmp/docker-runtime/fib_smoke
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" /tmp/docker-runtime
          docker run --rm "${IMAGE}:${TAG}" retdec-decompiler --help
          docker run --rm "${IMAGE}:${TAG}" analyse --help
          docker run --rm "${IMAGE}:${TAG}" analyse /opt/retdec/share/fib_smoke -o /work/fib.c
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "pushed ${IMAGE}:${TAG} and ${IMAGE}:latest"
          gh api --method PUT \
            "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/retdec/visibility" \
            -f visibility=public \
            || echo "package visibility left unchanged (set ghcr.io/${GITHUB_REPOSITORY_OWNER}/retdec public in GitHub Packages if pulls 401)"
