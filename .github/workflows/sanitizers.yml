name: sanitizers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/sanitizers.yml"
  schedule:
    - cron: "0 4 * * 0"

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3 \
            perl

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        with:
          cmakeVersion: "3.31.6"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh \
              --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Cache CMake build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/linux
          key: sanitizers-asan-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/**/CMakeLists.txt') }}
          restore-keys: |
            sanitizers-asan-

      # Must run BEFORE configure/build, not just before the ASan run:
      # YARA's ./configure compiles an ASan conftest and *executes* it to
      # decide whether it is cross-compiling. With the runner's default
      # vm.mmap_rnd_bits=32 that conftest cannot map its shadow, and
      # configure aborts with "cannot run C compiled programs".
      - name: Disable ASLR for ASan shadow mmap
        run: |
          # High-entropy ASLR on ubuntu-latest makes ASan fail to map its fixed
          # shadow: "Failed to mmap" / internal allocator OOM at 0x800. Same
          # workaround as actions/runner-images#9491.
          #
          # kernel.randomize_va_space=0 turns randomisation off outright and is
          # what actually fixes it. vm.mmap_rnd_bits cannot be lowered below
          # CONFIG_ARCH_MMAP_RND_BITS_MIN, which is 28 on x86-64, so the
          # `sysctl vm.mmap_rnd_bits=18` that used to be here always failed
          # with `Invalid argument` -- and because it sat after a build step
          # that had never once succeeded, nothing ever ran it to find out.
          # Ask for the kernel's minimum instead and do not fail if the kernel
          # refuses; randomize_va_space=0 already covers the case.
          sudo sysctl -w kernel.randomize_va_space=0
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.mmap_rnd_bits=28 \
            || echo "vm.mmap_rnd_bits not settable here; randomize_va_space=0 covers it"
          # Writes already print the new values. Do not `sysctl KEY` without
          # sudo: ubuntu-latest denies unprivileged reads of mmap_rnd_bits.

      - name: Configure (ASan, RelWithDebInfo, CPU-only CI)
        run: >
          cmake --preset core-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRETDEC_USE_UNDEFINED_BEHAVIOR_SANITIZER=ON
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_ENABLE_NEURAL=OFF

      - name: Build decompiler
        run: cmake --build build/linux --parallel --target retdec-decompiler

      - name: Build decompile sample corpus
        run: |
          mkdir -p /tmp/retdec_tests/c
          cat > /tmp/retdec_tests/c/hello.c <<'EOF'
          #include <stdio.h>
          int main(void) { printf("hello\n"); return 0; }
          EOF
          gcc -O2 -o /tmp/retdec_tests/c/hello /tmp/retdec_tests/c/hello.c
          strip /tmp/retdec_tests/c/hello
          # Best-effort: compile additional samples from tests/decompile_samples.
          bash tests/decompile_samples/compile_all.sh || true

      - name: Stage decompiler runtime config
        run: |
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "$DEC" ]; then echo "retdec-decompiler not found"; exit 1; fi
          dec_dir="$(cd "$(dirname "$DEC")" && pwd)"
          share_dir="$(cd "${dec_dir}/.." && pwd)/share/retdec"
          mkdir -p "${share_dir}/profiles"
          cp -f src/retdec-decompiler/decompiler-config.json "${share_dir}/"
          cp -f src/retdec-decompiler/profiles/*.json "${share_dir}/profiles/"
          echo "Staged runtime config: ${share_dir}/decompiler-config.json"

      - name: Add swap for ASan shadow
        run: |
          # ubuntu-latest already has /swapfile mounted; fallocate on it
          # fails with "Text file busy". Add a second file if needed.
          if grep -q /swapfile-retdec /proc/swaps; then
            echo "swapfile-retdec already active"
          elif [ "$(awk '/SwapTotal:/ {print $2}' /proc/meminfo)" -ge 4000000 ]; then
            echo "existing swap is enough"
          else
            sudo fallocate -l 8G /swapfile-retdec
            sudo chmod 600 /swapfile-retdec
            sudo mkswap /swapfile-retdec
            sudo swapon /swapfile-retdec
          fi
          swapon --show
          free -h

      # What the binary looks like decides whether ASan can map its shadow, and
      # run 45 -- the first that ever got past the build -- died with a bare
      # "ERROR: Failed to mmap" that says nothing about which mapping failed.
      # The ASan build is deliberately -no-pie (see deps/yara/CMakeLists.txt
      # and the top-level ASan flags), so the image is loaded at 0x400000 and
      # grows upward through the region ASan wants for its low shadow, which
      # starts at 0x7fff8000. An LLVM debug binary is large enough for that to
      # be a real question, so print the answer rather than reason about it.
      - name: Describe the ASan binary before running it
        run: |
          set -euo pipefail
          DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          if [ -z "${DEC}" ]; then echo "retdec-decompiler not found"; exit 1; fi
          ls -l "${DEC}"
          readelf -h "${DEC}" | sed -n '/Type:/p;/Entry point/p'
          size -A "${DEC}" 2>/dev/null | sed -n '1,3p;/\.bss/p;/Total/p' || true
          echo "--- kernel knobs as they stand now ---"
          sudo sysctl kernel.randomize_va_space vm.mmap_rnd_bits vm.overcommit_memory || true

      - name: Run ASan over decompile sample corpus
        env:
          # protect_shadow_gap=0 is what killed run 46, and runs 42-45 before
          # it. verbosity=1 printed the layout and named it:
          #
          #   || [0x00008fff7000, 0x02008fff6fff] || ShadowGap ||
          #   protect_shadow_gap=0: not protecting shadow gap, allocating
          #                         gap's shadow
          #   || [0x000091ff6000, 0x004091ff6fff] || ShadowGap's shadow ||
          #   ERROR: out of memory: failed to allocate 0x1000 (4096) bytes
          #          of InternalMmapVector (error code: 12)
          #
          # The gap spans 128 TB, so its shadow is about 63 TiB. The mapping
          # itself goes through under vm.overcommit_memory=1, and then the
          # process cannot get another four kilobytes. The option exists for
          # running under an emulator that cannot protect the gap; nothing
          # here needs it, and "ERROR: Failed to mmap" was all it ever said.
          #
          # verbosity=1 stays. It cost nothing and it is what answered this.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:handle_abort=1:symbolize=1:quarantine_size_mb=8:malloc_context_size=0:verbosity=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p profile_output
          shopt -s nullglob
          samples=(/tmp/retdec_tests/c/* /tmp/retdec_tests/cpp/* /tmp/retdec_tests/rust/*)
          ran=0
          for sample in "${samples[@]}"; do
            [ -f "$sample" ] || continue
            [ -x "$sample" ] || continue
            case "$sample" in
              *.c|*.cc|*.cpp|*.cxx|*.h|*.hpp|*.rs) continue ;;
            esac
            echo "=== ASan: $sample ==="
            timeout --kill-after=15 180 \
              setarch "$(uname -m)" -R -- bash scripts/run_asan.sh "$sample"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "No executable decompile samples found"
            exit 1
          fi
          echo "ASan finished $ran executable sample(s)"

      - name: Upload ASan log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: asan-ubsan-log
          path: profile_output/asan.log
          if-no-files-found: warn
