name: coverage

# CI-07 — gcov/lcov via the existing scripts/run_coverage.sh (core-coverage
# preset). Builds the pinned LLVM; dispatch and weekly only so it does not
# compete with installer jobs. A numeric ratchet needs a measured floor from
# a green artefact; this job publishes the lcov summary until that exists.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  lcov:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3 \
            perl \
            lcov

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "3.31.6"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh \
              --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Cache CMake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux
            ~/.cache/ccache
          key: coverage-linux-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'deps/**/CMakeLists.txt') }}
          restore-keys: |
            coverage-linux-

      - name: Collect coverage
        run: bash scripts/run_coverage.sh

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: |
            build/linux/coverage_filtered.info
            docs/coverage
          if-no-files-found: warn
          retention-days: 14
