name: algorithm-recovery-nightly

on:
  workflow_dispatch:
    inputs:
      full_corpus:
        description: Run full 216-binary corpus (slow)
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * 0"

jobs:
  recovery-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build python3 perl gcc clang

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      - name: Fetch large support files
        run: |
          bash scripts/fetch-large-files.sh || \
            bash scripts/fetch-large-files.sh \
              --base-url "https://raw.githubusercontent.com/odin-loki/RetDec-Decompiler/main"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build/linux
          key: algo-recovery-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/deps.cmake', 'cmake/**') }}
          restore-keys: |
            algo-recovery-

      - name: Configure (core-debug)
        run: >
          cmake --preset core-debug
          -DRETDEC_ENABLE_CUDA_ACCEL=OFF
          -DRETDEC_ENABLE_NEURAL=OFF

      - name: Build decompiler
        run: cmake --build build/linux --parallel 2 --target retdec-decompiler

      - name: Install decompiler prefix
        run: cmake --install build/linux || echo "cmake --install failed; recovery will stage build-tree config"

      - name: Algorithm recovery (CI core subset)
        run: |
          set -euo pipefail
          DEC=""
          if [[ -x install/linux/bin/retdec-decompiler ]]; then
            DEC="install/linux/bin/retdec-decompiler"
          else
            DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          fi
          test -n "$DEC" && test -x "$DEC"
          echo "decompiler=$DEC"
          "$DEC" --help >/dev/null || true
          bash scripts/run_algorithm_recovery_ci.sh --decompiler "$DEC" 2>&1 | tee algorithm-recovery-ci.log

      - name: Filename-rename integrity guard
        if: success() || failure()
        env:
          RENAME_GUARD_LIMIT: "12"
        run: |
          set -euo pipefail
          DEC=""
          if [[ -x install/linux/bin/retdec-decompiler ]]; then
            DEC="install/linux/bin/retdec-decompiler"
          else
            DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          fi
          test -n "$DEC" && test -x "$DEC"
          bash scripts/ci/benchmark_rename_guard.sh --decompiler "$DEC" --limit 12

      - name: Annotate algorithm recovery failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("algorithm-recovery-ci.log", "results/algorithm-recovery-ci.json"):
              p = Path(name)
              if not p.exists():
                  continue
              raw = p.read_text(errors="replace").splitlines()
              keys = ("extract:", "FAILED", "error:", "gate", "mean_f1", "decompiled", "not found")
              hits = [ln for ln in raw if any(k in ln for k in keys)]
              lines = (hits[-30:] + raw[-20:]) if hits else raw[-40:]
              text = "%0A".join(x.replace("%", "%25") for x in lines)
              print(f"::error::Algorithm recovery failed ({name})%0A{text}")
              break
          else:
              print("::error::Algorithm recovery failed and no log/results were produced")
          PY

      - name: Algorithm recovery (full corpus)
        if: github.event_name == 'workflow_dispatch' && inputs.full_corpus == true
        run: |
          DEC="${DEC:-}"
          if [[ -x install/linux/bin/retdec-decompiler ]]; then
            DEC="install/linux/bin/retdec-decompiler"
          else
            DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          fi
          bash scripts/run_algorithm_recovery_full.sh --decompiler "$DEC" --jobs 4

      - name: Algorithm recovery regression gate (CI core)
        run: |
          bash scripts/algorithm_recovery_regression_gate.sh \
            --current results/algorithm-recovery-ci.json \
            --profile ci_core

      - name: Algorithm recovery regression gate (full corpus)
        if: github.event_name == 'workflow_dispatch' && inputs.full_corpus == true
        run: |
          bash scripts/algorithm_recovery_regression_gate.sh \
            --current results/algorithm-recovery-full.json \
            --profile full_corpus

      - name: Update algorithm recovery baseline (CI core)
        if: success()
        run: |
          bash scripts/update_algorithm_recovery_baseline.sh \
            --from results/algorithm-recovery-ci.json \
            --profile ci_core

      - name: Update algorithm recovery baseline (full corpus)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.full_corpus == true
        run: |
          bash scripts/update_algorithm_recovery_baseline.sh \
            --from results/algorithm-recovery-full.json \
            --profile full_corpus
          git diff --stat results/baseline-algorithm-recovery.json || true

      - name: DecompileBench regression (CI core stand-in)
        run: |
          DEC="install/linux/bin/retdec-decompiler"
          if [[ ! -x "$DEC" ]]; then
            DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          fi
          bash scripts/fetch_decompilebench_corpus.sh --profile ci-core
          bash scripts/run_benchmarks.sh --profile ci-core --compare 2026-08 --gate

      - name: Migration eval suite
        run: |
          bash scripts/setup_eval_venv.sh
          DEC="install/linux/bin/retdec-decompiler"
          if [[ ! -x "$DEC" ]]; then
            DEC="$(find build/linux -name retdec-decompiler -type f | head -n1)"
          fi
          bash scripts/migration_eval_suite.sh --decompiler "$DEC"

      - name: Upload algorithm recovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algorithm-recovery-results
          path: |
            results/algorithm-recovery-ci.json
            results/algorithm-recovery-full.json
            results/baseline-algorithm-recovery.json
            results/lief-eval.json
            results/rellic-eval.json
            results/retypd-eval.json
            results/sailr-eval.json
            results/migration-eval-summary.json
            results/llvm-api-inventory.json
          if-no-files-found: warn
