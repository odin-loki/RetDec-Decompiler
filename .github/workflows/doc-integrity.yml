name: doc-integrity

# E8 / E9 — cheap, no-network Python checks. No LLVM, no decompiler build.
# ubuntu-latest is the gate. macos-latest (CI-05) and ubuntu-24.04-arm (CI-06)
# run the same scripts; they do not decompile Mach-O or ARM binaries.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e8-e9:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: E8 link-graph
        run: python scripts/ci/check_link_graph.py --self-test

      - name: E9 doc-vs-code
        run: python scripts/ci/check_doc_vs_code.py

      - name: DOC-05 withdrawn claims
        run: python scripts/ci/check_withdrawn_claims.py

      - name: LEG-02 Avast MIT notice
        run: python scripts/ci/check_avast_mit_notice.py

      - name: LEG-11 Keystone not installed
        run: python scripts/ci/check_keystone_not_installed.py

      - name: LEG-03 provenance rewrite-tells
        run: python scripts/ci/generate_provenance.py

      - name: REL-04 version drift
        run: python scripts/ci/check_version_drift.py

      - name: CI-04 release binaries
        run: python scripts/ci/check_release_binaries.py

      - name: CI-10 secret patterns
        run: python scripts/ci/check_secrets.py

      - name: REL-06 CycloneDX pins
        run: python scripts/ci/generate_cyclonedx.py --out "$RUNNER_TEMP/retdec.cdx.json"
