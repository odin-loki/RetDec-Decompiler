name: doc-integrity

# E8 / E9 — cheap, no-network Python checks. No LLVM, no decompiler build.
# ubuntu-latest is the gate. macos-latest (CI-05) and ubuntu-24.04-arm (CI-06)
# run the same scripts; they do not decompile Mach-O or ARM binaries.

on:
  # push on the working branches too: this gate is a docs consistency check
  # that costs seconds, and running it only on main means documentation drifts
  # for the whole life of a branch before anything notices.
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e8-e9:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: E8 link-graph
        run: python scripts/ci/check_link_graph.py --self-test

      - name: E9 doc-vs-code
        run: python scripts/ci/check_doc_vs_code.py

      - name: DOC-06 relative markdown links resolve
        run: |
          python scripts/ci/check_doc_links.py --self-test
          python scripts/ci/check_doc_links.py

      - name: DOC-05 withdrawn claims
        run: python scripts/ci/check_withdrawn_claims.py

      # CC-CONV. arm_conv.cpp set _numOfFPRegsPerParam and
      # _numOfVectorRegsPerParam and declared no floating-point or vector
      # registers at all -- the only one of the eleven conventions that did.
      # Nothing failed: usesFPRegistersForParameters() returns false when the
      # lists are empty, so the analysis never looked, while the two "how many
      # registers may one parameter span" numbers sat there reading as though
      # the subject had been thought about.
      - name: CC-CONV calling conventions declare what they claim
        run: |
          python scripts/ci/check_calling_conventions.py --self-test
          python scripts/ci/check_calling_conventions.py

      - name: LEG-02 Avast MIT notice
        run: python scripts/ci/check_avast_mit_notice.py

      - name: QUAL-08 ELF hardening self-test
        run: python scripts/ci/check_elf_hardening.py --self-test

      - name: QUAL-01 clang-tidy self-test
        run: python scripts/ci/run_clang_tidy.py --self-test

      - name: LEG-11 Keystone not installed
        run: python scripts/ci/check_keystone_not_installed.py

      - name: LEG-12 Qt dynamic link (CMake)
        run: python scripts/ci/check_qt_dynamic_link.py

      - name: LEG-03 provenance rewrite-tells
        run: python scripts/ci/generate_provenance.py

      - name: REL-04 version drift
        run: python scripts/ci/check_version_drift.py

      - name: CI-04 release binaries
        run: python scripts/ci/check_release_binaries.py

      - name: CI-10 secret patterns
        run: python scripts/ci/check_secrets.py

      - name: REL-06 CycloneDX pins
        run: python scripts/ci/generate_cyclonedx.py --out "$RUNNER_TEMP/retdec.cdx.json"

      # BOUND-01. Every int64 bound that gets +/- 1 must be bounded away from
      # the extreme that overflows. It ran only from check_push_gates.sh, which
      # no workflow invokes, so until now it protected nothing that CI enforced.
      - name: BOUND-01 int64 bound overflow guards
        run: python scripts/ci/check_bound_guards.py --self-test
